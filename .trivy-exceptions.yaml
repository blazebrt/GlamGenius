  - cve_or_advisory_id: "CVE-2026-16742"
    affected_package: "libsystemd0 and libudev1 (binary packages of the systemd source package)"
    installed_version: "257.13-1~deb13u1"
    reason: "No Debian trixie fixed package is available and the vulnerable binary package is not installed"
    exploitability_assessment: "The vulnerable code is home_authenticating_finish() in src/home/homed-home.c, which upstream (GHSA-jm29-p7hh-vjhv) compiles into the systemd-homed daemon and its systemd-homework worker. Those binaries ship in the separate Debian binary package systemd-homed, which is not installed in this image: dpkg reports no systemd-homed package and /usr/lib/systemd/systemd-homed, /usr/lib/systemd/systemd-homework and /usr/bin/homectl are all absent. libsystemd0 ships exactly one shared object, libsystemd.so.0.40.0, which is the client library and carries none of the homed record-authentication code; libudev1 ships only the device-enumeration library. Trivy flags both packages solely because Debian tracks this CVE against the systemd source package and Trivy maps source-package advisories onto every binary package built from that source. The upstream preconditions cannot be met here either: they require systemd-homed running and enabled, a logged-in user with an active homed-managed home directory, and the attacker editing their own ~/.identity file. This container runs no init and no systemd services, has no homed-managed users and no interactive login, and executes a single Uvicorn process as non-root UID 10001 whose account shell is /sbin/nologin. The advisory vector is CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:H/I:H/A:H, which requires a local authenticated user; the image provides no such login path."
    compensating_control: "The container runs as non-root UID 10001 with /sbin/nologin, contains no init system, no systemd services and no compiler, and exposes only the TCP Uvicorn HTTP port. No user-controlled input reaches libsystemd0 or libudev1: they are linked only as transitive dependencies of coreutils, util-linux and apt, none of which process request data."
    owner: "@blazebrt"
    created_date: "2026-09-03"
    review_date: "2026-09-05"
    expiry_date: "2026-09-08"
    upgrade_plan: "Remove this exception as soon as Debian publishes a fixed systemd package for trixie. Upstream fixed the flaw in v262, v261.2, v260.4, v259.8 and v258.10; trixie ships the 257.x line, so a Debian backport to 257.x is required. The build already runs apt-get upgrade -y against the live Debian repositories, so the fix is picked up by the next image build with no Dockerfile change; refresh the pinned base-image digest at that point and delete this entry."

  - cve_or_advisory_id: "CVE-2026-76642"
    affected_package: "util-linux source package (Trivy rows: bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux)"
    installed_version: "2.41.5-0+deb13u1 (source version of all nine binary packages; bsdutils is 1:2.41.5-0+deb13u1 and login is 1:4.16.0-2+really2.41.5-0+deb13u1)"
    reason: "No Debian trixie fixed package is available and the exploitation prerequisites are absent from the image"
    exploitability_assessment: "The image is genuinely inside the affected range and this is not a mapping artefact: the CNA gives util-linux v2.39 through v2.42.2 as affected, fixed upstream in v2.41.6 and v2.42.3, and dpkg reports 2.41.5-0+deb13u1 in the built image. Exploitation requires three things together: an /etc/fstab entry authorising an unprivileged user to mount via the user or users option, that same entry carrying the X-mount hook options the flaw abuses, and an external mount helper that fails, because the defect is that a failed external helper still runs the privileged X-mount post-hooks. None of the three exists here. /etc/fstab is the untouched Debian base stub, 37 bytes, root:root 0644, whose entire content is the single comment line '# UNCONFIGURED FSTAB FOR BASE SYSTEM'; it has zero non-comment entries, and parsing the option field of every non-comment line yields an empty set, so user, users and every X-mount option are absent as real options rather than merely absent as substrings. No external mount helper of any kind is installed: /sbin/mount.*, /usr/sbin/mount.*, /bin/mount.* and /usr/bin/mount.* match nothing, and neither do the umount helpers, so the failed-helper step the flaw depends on cannot occur. The application never invokes mount: the only process execution anywhere in the backend is two subprocess.run calls to python -m alembic in app/release.py, and the tokens mount, umount, nsenter, X-mount, fstab and libmount appear in no executable path, the only matches being the English 'mounted at' and the substring inside 'amount'. Stated plainly rather than favourably: /usr/bin/mount is present and is setuid root, mode 4755 owner root:root, so the binary itself is reachable. What is missing is every fstab authorisation and every external helper the flaw requires."
    compensating_control: "The container runs a single Uvicorn application process as non-root UID 10001 whose account shell is /sbin/nologin, has no init system or systemd services, contains no compiler, and exposes only the TCP HTTP service. PID 1 is /usr/bin/tini. Most importantly for this CVE, /etc/fstab contains zero non-comment entries and authorises no user or users mount with any X-mount hook option, and no external mount helper is installed. /usr/bin/mount remains present and setuid root as recorded in the exploitability assessment."
    owner: "@blazebrt"
    created_date: "2026-09-04"
    review_date: "2026-09-04"
    expiry_date: "2026-09-08"
    upgrade_plan: "Both stages of backend/Dockerfile already run apt-get update && apt-get upgrade -y against the live Debian repositories, so a fixed trixie package reaches the image on the next build with no Dockerfile change. Upstream fixed this in util-linux 2.41.6 and 2.42.3; trixie ships the 2.41.5 line, so a Debian backport to 2.41.x is required. Verified live from inside the built image on 2026-09-04: apt-cache policy util-linux reports Installed 2.41.5-0+deb13u1 and Candidate 2.41.5-0+deb13u1, and apt-cache madison offers only 2.41.5-0+deb13u1 from trixie-security and 2.41-5 from trixie, so no fixed candidate exists today. Removal was checked rather than assumed and is not an alternative: util-linux and bsdutils are Essential=yes, and apt refuses to remove libsmartcols1 or liblastlog2-2 because util-linux Pre-Depends on them at an exact version. The only cleanly removable package is mount, and removing it would still leave the other eight rows reporting this same CVE because Trivy maps it onto the shared source package. Re-run the candidate check at each review; when the candidate advances past 2.41.5-0+deb13u1, rebuild, refresh the pinned base-image digest in backend/Dockerfile and delete this entry."

  - cve_or_advisory_id: "CVE-2026-78408"
    affected_package: "util-linux source package (Trivy rows: bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux)"
    installed_version: "2.41.5-0+deb13u1 (source version of all nine binary packages; bsdutils is 1:2.41.5-0+deb13u1 and login is 1:4.16.0-2+really2.41.5-0+deb13u1)"
    reason: "No Debian trixie fixed package is available and the privileged operation the flaw abuses does not occur in this runtime"
    exploitability_assessment: "The image is genuinely inside the affected range: the CNA gives util-linux v2.40 through v2.42.2 as affected, fixed upstream in v2.41.6 and v2.42.3, and the image ships 2.41.5-0+deb13u1. The vulnerable operation is itself privileged: nsenter --join-cgroup against another target, which leaves root-authorised cgroup migration authority available to later execution. /usr/bin/nsenter is present but is mode 0755 owner root:root and is not setuid, the only one of the three examined util-linux binaries carrying no setuid bit. File capabilities were checked rather than assumed: getcap is not installed in this image, so the security.capability extended attribute was read directly, and /usr/bin/nsenter, /usr/bin/mount and /usr/bin/umount all report security.capability=NONE with an empty xattr set, while a sweep of the whole filesystem finds zero files carrying that attribute. nsenter therefore confers no authority at all on its caller, so an unprivileged caller gains nothing by executing it. Nothing in the production runtime invokes it: the image ENTRYPOINT is /usr/bin/tini -- and its CMD is uvicorn server:app, PID 1 in a normal run is /usr/bin/tini, and the string --join-cgroup appears nowhere in the Dockerfile, the application, or the compose files. The container's execution model supplies no privileged operator flow of the kind the advisory needs: it runs one Uvicorn process as non-root UID 10001 whose shell is /sbin/nologin, there is no init system at all, with /usr/lib/systemd/systemd, /lib/systemd/systemd, systemctl, loginctl and systemd-logind all absent and /run/systemd/system not present, and there is no interactive session in which an operator would run nsenter against another process. Presence of the binary is recorded rather than glossed; what is absent is the privileged caller and the invocation."
    compensating_control: "The container runs a single Uvicorn process as non-root UID 10001 whose account shell is /sbin/nologin, has no init system and no systemd services, contains no compiler, and exposes only the TCP HTTP port. nsenter carries neither a setuid bit nor any file capability -- no file in the image carries a security.capability attribute -- so it confers no authority the calling process does not already hold, and the calling process is unprivileged."
    owner: "@blazebrt"
    created_date: "2026-09-04"
    review_date: "2026-09-04"
    expiry_date: "2026-09-08"
    upgrade_plan: "Both stages of backend/Dockerfile already run apt-get update && apt-get upgrade -y against the live Debian repositories, so a fixed trixie package reaches the image on the next build with no Dockerfile change. Upstream fixed this in util-linux 2.41.6 and 2.42.3; trixie ships the 2.41.5 line, so a Debian backport to 2.41.x is required. Verified live from inside the built image on 2026-09-04: apt-cache policy util-linux reports Installed 2.41.5-0+deb13u1 and Candidate 2.41.5-0+deb13u1, and apt-cache madison offers only 2.41.5-0+deb13u1 from trixie-security and 2.41-5 from trixie. Removal is not an alternative for the reasons recorded against CVE-2026-76642; nsenter ships in the Essential util-linux package itself, which apt will not remove. Re-run the candidate check at each review; when the candidate advances past 2.41.5-0+deb13u1, rebuild, refresh the pinned base-image digest in backend/Dockerfile and delete this entry."

  - cve_or_advisory_id: "CVE-2026-78409"
    affected_package: "util-linux source package (Trivy rows: bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux)"
    installed_version: "2.41.5-0+deb13u1 (source version of all nine binary packages; bsdutils is 1:2.41.5-0+deb13u1 and login is 1:4.16.0-2+really2.41.5-0+deb13u1)"
    reason: "Source-package version mapping: the installed upstream version predates the vulnerable implementation, and no Debian trixie package change is available"
    exploitability_assessment: "This entry is deliberately not a component-unused argument, and it differs in kind from the other three util-linux entries of this date. The CNA states that the vulnerable detached-tree X-mount.subdir implementation was introduced in util-linux v2.42 and explicitly that v2.40 and v2.41 are not affected. This image ships the 2.41 line: dpkg reports source version 2.41.5-0+deb13u1 for all nine binary packages, and the binaries state their own upstream line when asked: mount --version prints 'mount from util-linux 2.41.5 (libmount 2.41.5: selinux, smack, btrfs, verity, namespaces, idmapping, fd-based-mount, statmount, statx, assert, debug)', umount --version prints 'umount from util-linux 2.41.5', and nsenter --version prints 'nsenter from util-linux 2.41.5', so the conclusion rests on the binaries themselves and not on Debian's version string alone. The installed code therefore predates the implementation this CVE describes, so the vulnerable code path is not merely unreached, it is not present. Debian nevertheless currently maps this CVE onto its trixie util-linux source package at 2.41, and Trivy inherits that source-package mapping onto every binary package built from that source, which is why nine rows appear for one advisory. The accurate characterisation is therefore a source-package and scanner version-mapping artefact against a binary built from an upstream version that predates the vulnerable code, and this should be revisited as a probable false positive rather than renewed as a runtime-reachability exception. Recorded as defence in depth and not as the reason: /etc/fstab is the Debian base stub with zero non-comment entries and an empty option set, so X-mount.subdir is absent as an option and no entry would authorise the unprivileged mount the flaw needs even if the vulnerable implementation were present."
    compensating_control: "The container runs a single Uvicorn process as non-root UID 10001 whose account shell is /sbin/nologin, has no init system and no systemd services, contains no compiler, and exposes only the TCP HTTP port. /etc/fstab authorises no mount by any user, and no external mount helper is installed."
    owner: "@blazebrt"
    created_date: "2026-09-04"
    review_date: "2026-09-04"
    expiry_date: "2026-09-08"
    upgrade_plan: "Two independent external events would each clear this row. Debian may correct the affected-version mapping for its trixie util-linux source package, since the CNA states the vulnerable implementation arrived in v2.42 and that v2.41 is not affected; or Debian may ship a package version that Trivy no longer matches. The build already runs apt-get update && apt-get upgrade -y against the live Debian repositories, so the second reaches the image with no Dockerfile change. Verified live from inside the built image on 2026-09-04: Candidate is 2.41.5-0+deb13u1, with nothing newer offered by trixie or trixie-security. Removal is not an alternative for the reasons recorded against CVE-2026-76642. At each review, re-check whether Debian still lists this CVE against trixie util-linux and whether Trivy still reports it; delete this entry as soon as either stops, and prefer reporting the mapping upstream to renewing this entry."

  - cve_or_advisory_id: "CVE-2026-78410"
    affected_package: "util-linux source package (Trivy rows: bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux)"
    installed_version: "2.41.5-0+deb13u1 (source version of all nine binary packages; bsdutils is 1:2.41.5-0+deb13u1 and login is 1:4.16.0-2+really2.41.5-0+deb13u1)"
    reason: "No Debian trixie fixed package is available and the exploitation prerequisites are absent from the image"
    exploitability_assessment: "The image is genuinely inside the affected range: the CNA gives util-linux v2.39 through v2.42.2 as affected, fixed upstream in v2.41.6 and v2.42.3, and the image ships 2.41.5-0+deb13u1. Exploitation requires an unprivileged restricted bind or rbind mount authorised through /etc/fstab, combined with X-mount.owner, X-mount.group or X-mount.mode, and a source path or an ancestor of it that the attacker can replace, because the defect is that restricted bind mounts do not pin their source. The authorising configuration does not exist. /etc/fstab is the untouched Debian base stub, 37 bytes, root:root 0644, containing only the comment line '# UNCONFIGURED FSTAB FOR BASE SYSTEM' and zero non-comment entries; option-field parsing of every non-comment line yields an empty set, so bind, rbind, X-mount.owner, X-mount.group and X-mount.mode are all absent as real options rather than as substrings. With no fstab entry, no unprivileged user may invoke a restricted bind mount at all, so the attacker-controlled-source question is never reached. The runtime user is UID 10001 with shell /sbin/nologin, and the application invokes neither mount nor umount: the only process execution in the backend is two subprocess.run calls to python -m alembic in app/release.py. As with CVE-2026-76642, /usr/bin/mount is setuid root at mode 4755 and that is stated rather than glossed; the missing prerequisite is the fstab authorisation, not the binary."
    compensating_control: "The container runs a single Uvicorn application process as non-root UID 10001 whose account shell is /sbin/nologin, has no init system or systemd services, contains no compiler, and exposes only the TCP HTTP service. For this CVE, /etc/fstab contains zero non-comment entries, so it authorises no restricted bind or rbind mount and contains none of X-mount.owner, X-mount.group or X-mount.mode. /usr/bin/mount remains present and setuid root as recorded in the exploitability assessment."
    owner: "@blazebrt"
    created_date: "2026-09-04"
    review_date: "2026-09-04"
    expiry_date: "2026-09-08"
    upgrade_plan: "Both stages of backend/Dockerfile already run apt-get update && apt-get upgrade -y against the live Debian repositories, so a fixed trixie package reaches the image on the next build with no Dockerfile change. Upstream fixed this in util-linux 2.41.6 and 2.42.3; trixie ships the 2.41.5 line, so a Debian backport to 2.41.x is required. Verified live from inside the built image on 2026-09-04: apt-cache policy util-linux reports Installed 2.41.5-0+deb13u1 and Candidate 2.41.5-0+deb13u1, and apt-cache madison offers only 2.41.5-0+deb13u1 from trixie-security and 2.41-5 from trixie. Removal was checked and is not an alternative, for the reasons recorded against CVE-2026-76642. Re-run the candidate check at each review; when the candidate advances past 2.41.5-0+deb13u1, rebuild, refresh the pinned base-image digest in backend/Dockerfile and delete this entry."
