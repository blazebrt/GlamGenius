# Container vulnerability exceptions.
#
# Every entry here suppresses a HIGH or CRITICAL Trivy finding on the
# production image, so every entry is a decision to ship a known finding.
# scripts/validate_trivy_exceptions.py is the only thing that may write
# .trivyignore: it validates each entry, refuses wildcards, refuses an expired
# expiry_date, and regenerates the ignore file from what survives. Do not
# hand-author .trivyignore.
#
# The list is empty as of the 2026-09-05 expiry review. It was not emptied by
# relaxing anything: a Trivy scan of a freshly built production image, with no
# ignore file applied and a vulnerability database downloaded that same day,
# reported zero HIGH and zero CRITICAL findings. The same database in the same
# run reported 29 HIGH/CRITICAL rows against the pinned base image the
# Dockerfile starts from, and 120 rows against the built image across all
# severities, so the empty result is a real result and not a database that
# failed to load.
#
# Adding an entry requires all of: cve_or_advisory_id, affected_package,
# installed_version, reason, exploitability_assessment, compensating_control,
# owner, created_date, review_date, expiry_date, upgrade_plan.

exceptions: []
