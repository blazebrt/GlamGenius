# Container vulnerability exceptions — requalified 2026-10-04.
#
# Authority: exact main 07fadead6fdd9c5cf69e2599d34ea4abfe5558a1;
# production Render image from CI #880 (image ID
# sha256:5a123d3461d6365972f59d5a1d49589e2119073b9a984647cdb609ccff467c79).
# Its Dockerfile uses pinned python base digest
# sha256:90744cff8f32887f075c47d747a173ff333e9e98801667af93c357fa9f5e28ff.
# The image is Debian 13.7, amd64. Trivy v0.73.0 with DB updated
# 2026-10-04T01:47:20Z scanned the CI-built image tar from a temporary
# directory with no .trivyignore and no --ignorefile. Unfiltered result:
# 44 HIGH rows, 0 CRITICAL rows, 8 distinct CVEs, all eight already governed
# in the prior registry, no new HIGH/CRITICAL CVE.
#
# Ten fixed-and-absent findings retired: CVE-2026-41992, CVE-2026-42496,
# CVE-2026-42497, CVE-2026-57433, CVE-2026-48962, CVE-2026-57432,
# CVE-2026-8376, CVE-2026-13221, CVE-2026-11822, CVE-2026-11824.
# Eight still-reported findings retained temporarily; CVE-2026-78409 is
# separately identified below as an upstream-version mapping false-positive
# candidate, not silently treated as an ordinary runtime exception.
#
# Local Docker engine was unavailable; the exact-main CI production image
# artifact is the sole image authority. No claim of an independent local build
# is made. The production Dockerfile runs apt-get upgrade against live Debian
# repositories, so repeat builds can change OS package versions even at the
# same Git commit and pinned base digest. Re-scan any newly built image.
#
# scripts/validate_trivy_exceptions.py is the only writer of .trivyignore.
# No wildcard, missing field, malformed date, duplicate ID, or expired entry
# may pass. An invalid registry must not rewrite the generated ignore file.
# created_date is preserved on all retained entries; fresh evidence was
# collected 2026-10-04, next review is 2026-10-11, expiry is 2026-10-18.
#
# Every suppression is a known HIGH vulnerability finding and requires human
# independent review. See docs/security/POST_LANE2_TRIVY_REQUALIFICATION.md.

exceptions:
  - cve_or_advisory_id: "CVE-2025-69720"
    affected_package: "ncurses family"
    installed_version: "6.5+20250216-2"
    reason: "No fixed Debian trixie build; ncurses-bin is Essential and cannot safely be removed."
    exploitability_assessment: "The live Trivy scan reports four ncurses-source binary rows at 6.5+20250216-2. The affected parser is the installed infocmp CLI; a repository search found no production invocation of infocmp, tic, or toe and no request-to-CLI route. Presence is acknowledged, but customer input has no path to the parser."
    compensating_control: "Runtime executes Uvicorn as UID 10001 with no exposed shell or terminal endpoint; no application subprocess invokes ncurses tools."
    owner: "@blazebrt"
    created_date: "2026-08-08"
    review_date: "2026-10-11"
    expiry_date: "2026-10-18"
    upgrade_plan: "Re-scan the next production image; remove this entry immediately when Debian trixie publishes and the image installs a fixed ncurses build, or when ncurses-bin can be safely removed from a supported base."

  - cve_or_advisory_id: "CVE-2026-54369"
    affected_package: "libacl1"
    installed_version: "2.3.2-2+b1"
    reason: "No fixed Debian trixie acl build; libacl1 cannot be removed without disturbing passwd dependencies in this image."
    exploitability_assessment: "The unfiltered image reports libacl1 2.3.2-2+b1. Exploitation requires a privileged pathname-based ACL operation while an attacker controls path components. The production application runs UID 10001 and does not call setfacl/getfacl or perform privileged ACL operations on user paths; libacl1 remains a dependency of passwd, so removal is not a verified safe remediation."
    compensating_control: "Non-root Uvicorn runtime; no privileged ACL operation or shell endpoint is exposed to customer requests."
    owner: "@blazebrt"
    created_date: "2026-08-08"
    review_date: "2026-10-11"
    expiry_date: "2026-10-18"
    upgrade_plan: "Remove this entry after a fixed trixie acl package is installed in the built image, or after a separately validated image slimming removes libacl1 and its dependent tooling safely."

  - cve_or_advisory_id: "CVE-2026-9538"
    affected_package: "perl-base"
    installed_version: "5.40.1-6+deb13u1"
    reason: "Debian trixie Perl remains vulnerable to this separate Archive::Tar advisory; perl-base is Essential."
    exploitability_assessment: "The unfiltered scan still reports perl-base at 5.40.1-6+deb13u1. The vulnerable Archive::Tar extraction module is absent from the CI-built runtime image, and repository search found no Perl execution or user-controlled archive extraction through Perl. Other Perl CVEs fixed by this build were retired; this one was not."
    compensating_control: "Only Uvicorn runs as UID 10001; no request handler invokes Perl Archive::Tar or a shell archive processor."
    owner: "@blazebrt"
    created_date: "2026-08-08"
    review_date: "2026-10-11"
    expiry_date: "2026-10-18"
    upgrade_plan: "Retire when a supported trixie Perl build fixes CVE-2026-9538 and appears in the image, or when a validated supported base can omit perl-base without breaking its Essential package contract."

  - cve_or_advisory_id: "CVE-2026-16742"
    affected_package: "libsystemd0 and libudev1 (binary packages of the systemd source package)"
    installed_version: "257.13-1~deb13u1"
    reason: "No fixed Debian trixie systemd build; Trivy maps a systemd-homed source advisory onto installed client libraries."
    exploitability_assessment: "The unfiltered image reports libsystemd0 and libudev1 257.13-1~deb13u1. The systemd-homed package and homed/homework/homectl binaries are absent; the image has no systemd init or homed service. The advisory's vulnerable homed authentication path is therefore absent from these installed client-library binaries. Removing libsystemd0/libudev1 is unsafe: bsdutils/util-linux and package-management libraries depend on them."
    compensating_control: "Non-root UID 10001 Uvicorn runtime, no systemd service or homed-managed account, and no request route into homed authentication."
    owner: "@blazebrt"
    created_date: "2026-09-03"
    review_date: "2026-10-11"
    expiry_date: "2026-10-18"
    upgrade_plan: "Remove when Debian trixie publishes a fixed systemd build installed by the production image, or when Debian/Trivy corrects the binary-package source mapping."

  - cve_or_advisory_id: "CVE-2026-76642"
    affected_package: "util-linux source package (Trivy rows: bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux)"
    installed_version: "2.41.5-0+deb13u1 (source version of all nine binary packages; bsdutils is 1:2.41.5-0+deb13u1 and login is 1:4.16.0-2+really2.41.5-0+deb13u1)"
    reason: "No fixed trixie util-linux build; affected util-linux and bsdutils are Essential."
    exploitability_assessment: "Nine util-linux-source rows remain at 2.41.5-0+deb13u1. The advisory requires an fstab-authorized unprivileged mount with X-mount post-hooks and a failing external helper. The CI image /etc/fstab has only the base comment and zero active entries; no helper is present. mount is present, but application code does not invoke it. Without fstab authorization the affected post-hook path is not reached."
    compensating_control: "Non-root Uvicorn runtime; zero operative fstab entries; no request-triggered mount invocation. Presence of the mount binary is not hidden."
    owner: "@blazebrt"
    created_date: "2026-09-04"
    review_date: "2026-10-11"
    expiry_date: "2026-10-18"
    upgrade_plan: "Remove when a supported Debian trixie util-linux package beyond the vulnerable 2.41.5 build is installed and the unfiltered scan no longer reports this CVE. Reassess fstab and helper presence on every rebuilt image."

  - cve_or_advisory_id: "CVE-2026-78408"
    affected_package: "util-linux source package (Trivy rows: bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux)"
    installed_version: "2.41.5-0+deb13u1 (source version of all nine binary packages; bsdutils is 1:2.41.5-0+deb13u1 and login is 1:4.16.0-2+really2.41.5-0+deb13u1)"
    reason: "No fixed trixie util-linux build; nsenter is in Essential util-linux."
    exploitability_assessment: "Nine source-mapped rows remain at util-linux 2.41.5-0+deb13u1. The vulnerable operation is nsenter --join-cgroup by an already privileged caller. nsenter is installed, but production application code never invokes nsenter, --join-cgroup, or privileged cgroup migration; runtime is UID 10001. A privileged operator action would need separate review."
    compensating_control: "Non-root Uvicorn runtime, no service/init runtime or exposed shell, and no request-to-nsenter path."
    owner: "@blazebrt"
    created_date: "2026-09-04"
    review_date: "2026-10-11"
    expiry_date: "2026-10-18"
    upgrade_plan: "Remove when an officially fixed trixie util-linux package lands in the image; re-evaluate if any operational flow begins invoking nsenter."

  - cve_or_advisory_id: "CVE-2026-78409"
    affected_package: "util-linux source package (Trivy rows: bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux)"
    installed_version: "2.41.5-0+deb13u1 (source version of all nine binary packages; bsdutils is 1:2.41.5-0+deb13u1 and login is 1:4.16.0-2+really2.41.5-0+deb13u1)"
    reason: "Scanner/source-package affected-version mapping candidate; upstream states vulnerable implementation begins in 2.42, but image is 2.41.5."
    exploitability_assessment: "Trivy reports nine util-linux-source rows for 2.41.5-0+deb13u1. The upstream maintainer advisory GHSA-8f2p-47x3-43mv explicitly lists affected versions >=2.42; the detached X-mount.subdir path was introduced after the installed 2.41.5 line. Debian still maps the CVE onto trixie util-linux, so the row persists. This is recorded separately as an independently reviewable mapping candidate, not a proven exploitable runtime finding."
    compensating_control: "The image /etc/fstab has no operative entries, so it grants no X-mount.subdir restricted mount; runtime is UID 10001."
    owner: "@blazebrt"
    created_date: "2026-09-04"
    review_date: "2026-10-11"
    expiry_date: "2026-10-18"
    upgrade_plan: "Request upstream Debian/Trivy mapping correction. Retire as soon as the unfiltered scan no longer reports it, or an officially fixed trixie build replaces 2.41.5. Keep this short-lived distinct exception pending independent review."

  - cve_or_advisory_id: "CVE-2026-78410"
    affected_package: "util-linux source package (Trivy rows: bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux)"
    installed_version: "2.41.5-0+deb13u1 (source version of all nine binary packages; bsdutils is 1:2.41.5-0+deb13u1 and login is 1:4.16.0-2+really2.41.5-0+deb13u1)"
    reason: "No fixed trixie util-linux build; affected util-linux and bsdutils are Essential."
    exploitability_assessment: "Nine source-mapped rows remain at util-linux 2.41.5-0+deb13u1. The flaw needs an fstab-authorized restricted bind/rbind mount with X-mount.owner, group, or mode and an attacker-replaceable source path. The CI image /etc/fstab has zero non-comment entries, so none of those options or authorizations exist. mount is present but not invoked by application code."
    compensating_control: "Non-root UID 10001 Uvicorn runtime and no request-to-mount path; no operative fstab authorizations."
    owner: "@blazebrt"
    created_date: "2026-09-04"
    review_date: "2026-10-11"
    expiry_date: "2026-10-18"
    upgrade_plan: "Remove when an officially fixed trixie util-linux build lands in the image; re-check the fstab prerequisite on every image rebuild."
