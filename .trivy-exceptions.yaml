  - cve_or_advisory_id: "CVE-2026-14456"
    affected_package: "libssl3t64"
    installed_version: "3.5.6-1~deb13u2"
    reason: "No Debian trixie fixed package is available"
    exploitability_assessment: "The vulnerable incoming-channel queue is used only by an OpenSSL QUIC server. GlamGenius runs Uvicorn as an HTTP-over-TCP server and has no QUIC or HTTP/3 dependency or runtime code path."
    compensating_control: "The container exposes only the TCP Uvicorn service, runs as non-root UID 10001, and has no shell access."
    owner: "@blazebrt"
    created_date: "2026-08-19"
    review_date: "2026-08-28"
    expiry_date: "2026-09-08"
    upgrade_plan: "Remove this exception and update the immutable Python base-image digest as soon as Debian publishes a fixed OpenSSL package."

  - cve_or_advisory_id: "CVE-2026-11822"
    affected_package: "libsqlite3-0"
    installed_version: "3.46.1-7+deb13u1"
    reason: "No Debian trixie fixed package is available"
    exploitability_assessment: "The vulnerable FTS5 path requires a crafted SQLite database and GlamGenius uses PostgreSQL as its production datastore; the application does not open attacker-supplied SQLite databases or execute FTS5 queries."
    compensating_control: "Minimal container surface with non-root user and no shell access; database access is confined to the PostgreSQL service."
    owner: "@blazebrt"
    created_date: "2026-08-26"
    review_date: "2026-09-02"
    expiry_date: "2026-09-08"
    upgrade_plan: "Remove this exception immediately when Debian publishes the trixie sqlite3 fix and refresh the immutable Python base-image digest."

