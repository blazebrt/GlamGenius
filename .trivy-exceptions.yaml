  - cve_or_advisory_id: "CVE-2026-16742"
    affected_package: "libsystemd0 and libudev1 (binary packages of the systemd source package)"
    installed_version: "257.13-1~deb13u1"
    reason: "No Debian trixie fixed package is available and the vulnerable binary package is not installed"
    exploitability_assessment: "The vulnerable code is home_authenticating_finish() in src/home/homed-home.c, which upstream (GHSA-jm29-p7hh-vjhv) compiles into the systemd-homed daemon and its systemd-homework worker. Those binaries ship in the separate Debian binary package systemd-homed, which is not installed in this image: dpkg reports no systemd-homed package and /usr/lib/systemd/systemd-homed, /usr/lib/systemd/systemd-homework and /usr/bin/homectl are all absent. libsystemd0 ships exactly one shared object, libsystemd.so.0.40.0, which is the client library and carries none of the homed record-authentication code; libudev1 ships only the device-enumeration library. Trivy flags both packages solely because Debian tracks this CVE against the systemd source package and Trivy maps source-package advisories onto every binary package built from that source. The upstream preconditions cannot be met here either: they require systemd-homed running and enabled, a logged-in user with an active homed-managed home directory, and the attacker editing their own ~/.identity file. This container runs no init and no systemd services, has no homed-managed users and no interactive login, and executes a single Uvicorn process as non-root UID 10001 whose account shell is /sbin/nologin. The advisory vector is CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:H/I:H/A:H, which requires a local authenticated user; the image provides no such login path."
    compensating_control: "The container runs as non-root UID 10001 with /sbin/nologin, contains no init system, no systemd services and no compiler, and exposes only the TCP Uvicorn HTTP port. No user-controlled input reaches libsystemd0 or libudev1: they are linked only as transitive dependencies of coreutils, util-linux and apt, none of which process request data."
    owner: "@blazebrt"
    created_date: "2026-09-03"
    review_date: "2026-09-05"
    expiry_date: "2026-09-08"
    upgrade_plan: "Remove this exception as soon as Debian publishes a fixed systemd package for trixie. Upstream fixed the flaw in v262, v261.2, v260.4, v259.8 and v258.10; trixie ships the 257.x line, so a Debian backport to 257.x is required. The build already runs apt-get upgrade -y against the live Debian repositories, so the fix is picked up by the next image build with no Dockerfile change; refresh the pinned base-image digest at that point and delete this entry."
