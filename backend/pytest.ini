[pytest]
testpaths = tests
asyncio_mode = auto

# One event loop for the whole session.
#
# asyncpg creates its pool at import time in database.py and binds it to the
# first loop that drives it. With a loop per test, every test after the first
# dies with "Event loop is closed". The same applies to asyncpg's pool. Sharing
# one loop matches how the app actually runs — a single long-lived loop — so it
# is also the more faithful test.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore:.*InsecureKeyLengthWarning.*:UserWarning
