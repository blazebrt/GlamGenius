# Ruff configuration for GlamGenius backend.
# See https://docs.astral.sh/ruff/configuration/

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
# Enable a conservative set of rules that won't create noise on an
# existing codebase while still catching real problems.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "T20", # flake8-print (no print() in prod code)
]
ignore = [
    "E501",   # line-too-long — enforced by formatter instead
    "E402",   # module-level import not at top — server.py loads dotenv first
    "E701",   # multiple statements on one line (colon) — compact dict builders
    "E702",   # multiple statements on one line (semicolon) — compact dict builders
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "SIM108", # use ternary operator — readability trade-off
    "SIM105", # use contextlib.suppress — readability trade-off
    "UP007",  # use X | Y for union type — keep Optional for older style
    "UP038",  # use X | Y in isinstance — can cause subtle runtime issues
    "B904",   # raise from — existing exception handling patterns
    "PIE810", # call startswith once with a tuple — readability trade-off
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "B017", "F841", "SIM118", "B007"]  # test-specific: print, broad raises, unused vars, dict.keys(), loop vars
"migrations/**" = ["E", "F", "I", "UP", "B", "SIM", "PIE", "T20"]  # autogenerated
"reset_db.py" = ["T20"]  # utility script, print is fine
"server.py" = ["E402"]  # load_dotenv() must run before imports
