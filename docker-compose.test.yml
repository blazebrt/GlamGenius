# Test stack. Everything runs in containers — this machine needs no Python and
# no Node installed.
#
#   docker compose -f docker-compose.test.yml run --rm backend-tests
#   docker compose -f docker-compose.test.yml run --rm frontend-tests
#   docker compose -f docker-compose.test.yml down -v
#
# Databases here are throwaway: tmpfs, no volumes, dropped with the stack.

services:
  test-mongo:
    image: mongo:6
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 30

  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glamgenius
      POSTGRES_PASSWORD: glamgenius
      POSTGRES_DB: glamgenius_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glamgenius -d glamgenius_test"]
      interval: 3s
      timeout: 5s
      retries: 30

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://test-mongo:27017
      DB_NAME: glamgenius_test
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@test-postgres:5432/glamgenius_test
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_ROOT: /tmp/media-test
      JWT_SECRET: test-secret-not-a-real-one
      ADMIN_SECRET: test-admin-secret
      # No Gemini key on purpose. The provider is faked in tests, and the
      # unconfigured-provider path is itself something worth testing.
      GEMINI_API_KEY: ""
      SUBSCRIPTIONS_AVAILABLE: "false"
      # Most tests exercise AI failure behaviour rather than the consent gate.
      # Dedicated tests turn enforcement on and prove the real scan routes.
      REQUIRE_ANALYSIS_CONSENT: "false"
      V2_FEATURES: "v2_media,v2_privacy,v2_consent,v2_ai_gateway,v2_profile,v2_inventory"
      PYTHONPATH: /app
    depends_on:
      test-mongo:
        condition: service_healthy
      test-postgres:
        condition: service_healthy
    working_dir: /app
    command: >
      sh -c "alembic upgrade head &&
             alembic check &&
             pytest -q tests"

  frontend-tests:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Keep node_modules inside the container so a host without Node still
      # works and nothing is written back into the repo.
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npx tsc --noEmit &&
             npm run lint &&
             npm test -- --ci"

volumes:
  frontend_node_modules:
