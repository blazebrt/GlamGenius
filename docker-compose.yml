version: "3.8"

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: glamgenius
      # Pass secrets via env_file (.env) — never hardcode API keys here
    env_file:
      - .env
    depends_on:
      - mongo

volumes:
  mongo_data:
