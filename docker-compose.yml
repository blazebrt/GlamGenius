# Development / preview stack.
#
# Runs the whole application from a machine with only Git and Docker
# installed. Service-image digests are pinned via scripts/update_service_digests.sh
# so a `docker compose build --no-cache && docker compose up -d` today produces
# the same runtime bytes it produced yesterday.
#
# Fix 4 (WP2): images are pinned to sha256 digests, not moving minor tags.
# The tag comment after each digest is guidance for the human reviewer only;
# Docker resolves the digest.
#
# Bring up:
#   docker compose build --no-cache
#   docker compose up -d
#   docker compose ps
#
# Tear down:
#   docker compose down -v

services:
  mongo:
    # Fix 4 (WP2): pin to a sha256 digest via scripts/update_service_digests.sh
    # before the first production deployment. The minor tag below is the
    # baseline for the pre-digest work; a bump replaces the whole `image:` line
    # with `mongo:6.0.19@sha256:<digest>`. See docs/engineering/DOCKER_REPRODUCIBILITY.md.
    image: mongo:6.0.19
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Audit finding F28: the backend could start before Mongo accepted
      # connections. It has a healthcheck now, and the backend waits for it.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    # Fix 4 (WP2): pin to sha256 via scripts/update_service_digests.sh — see
    # comment above.
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glamgenius
      POSTGRES_PASSWORD: glamgenius
      POSTGRES_DB: glamgenius_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glamgenius -d glamgenius_v2"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: glamgenius
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@postgres:5432/glamgenius_v2
      MEDIA_LOCAL_ROOT: /data/media
      # Pass secrets via env_file (.env) — never hardcode API keys here
    env_file:
      - .env
    volumes:
      - media_data:/data/media
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Migrations run on start so a fresh checkout needs one command, and a
    # deploy can never serve a schema older than its code.
    healthcheck:
      # The API starts only after Alembic succeeds. Waiting for this endpoint
      # therefore also guarantees that workers see the migrated schema.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/health', timeout=3)",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: glamgenius
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@postgres:5432/glamgenius_v2
      MEDIA_LOCAL_ROOT: /data/media
    env_file:
      - .env
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: python -m app.workers.outbox_relay

volumes:
  mongo_data:
  postgres_data:
  media_data:
