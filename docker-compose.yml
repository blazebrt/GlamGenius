services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Audit finding F28: the backend could start before Mongo accepted
      # connections. It has a healthcheck now, and the backend waits for it.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glamgenius
      POSTGRES_PASSWORD: glamgenius
      POSTGRES_DB: glamgenius_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glamgenius -d glamgenius_v2"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: glamgenius
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@postgres:5432/glamgenius_v2
      MEDIA_LOCAL_ROOT: /data/media
      # Pass secrets via env_file (.env) — never hardcode API keys here
    env_file:
      - .env
    volumes:
      - media_data:/data/media
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Migrations run on start so a fresh checkout needs one command, and a
    # deploy can never serve a schema older than its code.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn server:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # The API starts only after Alembic succeeds. Waiting for this endpoint
      # therefore also guarantees that workers see the migrated schema.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/health', timeout=3)",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: glamgenius
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@postgres:5432/glamgenius_v2
      MEDIA_LOCAL_ROOT: /data/media
    env_file:
      - .env
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: python -m app.workers.outbox_relay

volumes:
  mongo_data:
  postgres_data:
  media_data:
