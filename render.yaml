# GlamGenius pre-PMF runtime — Render Blueprint.
#
# ONE free Docker web service. Not a smaller version of a production estate —
# a deliberately different shape, chosen because paying for infrastructure
# before product-market fit is a bet on demand nobody has measured yet.
# Documented at https://render.com/docs/blueprint-spec.
#
# ---------------------------------------------------------------------------
# What replaced the two workers
# ---------------------------------------------------------------------------
# This used to declare three services: the API, an always-on account-deletion
# worker, and a Render cron for notifications. Render free tier has no
# background workers and no cron, so both batch jobs moved behind HTTP:
#
#   Supabase Cron  --every 5 min-->  POST /api/v2/internal/scheduler/account-deletion
#   Supabase Cron  --hourly------->  POST /api/v2/internal/scheduler/notifications
#
# Authorised by a shared secret held in Supabase Vault and in this service's
# secret environment — never a customer JWT, and never in this file. The jobs
# themselves are unchanged: the same deletion state machine, the same
# notification cycle, the same heartbeats. Only the invoker moved.
#
# The 5-minute deletion call also keeps the free instance warm as a side
# effect. That is a consequence of work that has to happen anyway, not a
# keepalive: no self-ping, no uptime robot, no synthetic traffic exists.
#
# ---------------------------------------------------------------------------
# Free tier, honestly
# ---------------------------------------------------------------------------
# No SLA. One instance. It can restart, it can be suspended if free quotas run
# out, and a cold start is a real wait. This is private-beta hosting for PMF
# validation, and it is not production-grade infrastructure.
#
# APP_ENV stays `production` anyway, on purpose: that is what turns on every
# production safety validator — invite-only, consent, Supabase storage, no
# local media, asymmetric JWT verification. Production *safety configuration*
# and production-grade *infrastructure SLA* are different things, and this
# runtime has the first without the second.
#
# ---------------------------------------------------------------------------
# Why there is no database here
# ---------------------------------------------------------------------------
# There is deliberately no `databases:` block. The application authority is the
# existing Supabase PostgreSQL project, and Store A — the Open Food Facts copy
# — is a physically separate Supabase project. Letting Render create a managed
# Postgres alongside them would introduce a third, ownerless authority and
# would invite exactly the mistake the ODbL wall exists to prevent: two stores
# that quietly become one. Both URLs arrive through the environment and
# `validate_production_configuration()` refuses to start if they are equal.
#
# There is no Key Value / Redis either. Nothing in this system needs one.
#
# ---------------------------------------------------------------------------
# Why nothing deploys itself
# ---------------------------------------------------------------------------
# `autoDeployTrigger: "off"` and nothing else. It supersedes the deprecated
# `autoDeploy`, and writing both — which this file used to do — gave the
# Blueprint parser two sources of truth for one decision. One field, one
# answer. `"off"` is quoted because YAML 1.1 reads a bare off as the boolean
# false, which is not the string the schema expects.
#
# A deployment is an operator deploying one exact reviewed Git SHA, never
# "latest".
#
# ---------------------------------------------------------------------------
# Why the release gate is in dockerCommand
# ---------------------------------------------------------------------------
# `preDeployCommand` is a paid feature and is not available on free. The gate
# did not go away: it moved into the start command, joined with `&&`, so the
# API cannot start unless `python -m app.release` exits zero.
#
#   release succeeds -> exec uvicorn -> API serves
#   release fails    -> non-zero exit -> container dies -> API never serves
#
# `&&` and not `;`, because `;` would run uvicorn against a database that was
# never migrated. There is no `|| true`, no backgrounding and no best-effort
# migration anywhere in this file.
#
# `python -m app.release` remains the one release authority: production config
# validation, the PostgreSQL advisory lock, `alembic upgrade head`,
# `alembic check`, Store A provisioning, reference-data seeding and the
# consistency checks. It is repeat-safe, so running it on every container start
# is correct rather than merely tolerable. None of it is restated here.
#
# ---------------------------------------------------------------------------
# What this file is not
# ---------------------------------------------------------------------------
# It is not a knowledge activation. Deploying the software and governing what
# the product is allowed to say are two different events, and this file only
# performs the first. Nothing here runs the Phase B controlled activation
# operator. Production activation is a deliberate human one-off job, described
# in docs/OPERATIONS.md.
#
# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------
#   glamgenius-production-invariants  declared below. Non-secret governance
#                                     values that must not drift, so they are
#                                     version-controlled rather than typed
#                                     into a dashboard.
#
#   glamgenius-production-secrets     NOT declared here and never in Git. The
#                                     operator creates it in the Render
#                                     dashboard and fills it in BEFORE the
#                                     first Blueprint sync. A sync that runs
#                                     first fails because the group does not
#                                     exist — which is the correct failure:
#                                     it stops before creating a service that
#                                     would start unconfigured.
#
# The key names that group must contain are listed in docs/OPERATIONS.md, and
# now include INTERNAL_SCHEDULER_TOKEN. No value for any of them belongs in
# this file, in any test, or in any commit.

services:
  # --- The only service ----------------------------------------------------
  - type: web
    name: glamgenius-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    # Readiness, not liveness. /api/v2/ready checks PostgreSQL, the production
    # configuration invariants, storage, the seed version, the Alembic head,
    # scheduled-worker heartbeat freshness and the AI provider, and answers 503
    # until all of them hold. Render must not send customer traffic before
    # that. /api/v2/health is liveness and is the container's own healthcheck.
    healthCheckPath: /api/v2/ready
    # The release gate, then the server. See "Why the release gate is in
    # dockerCommand" above. The image's WORKDIR is /workspace/backend.
    dockerCommand: sh -c "python -m app.release && exec uvicorn server:app --host 0.0.0.0 --port $PORT"
    # No disk: media lives in Supabase Storage in production, and
    # /api/v2/ready refuses to be ready if the local adapter is selected.
    envVars:
      - fromGroup: glamgenius-production-invariants
      - fromGroup: glamgenius-production-secrets

envVarGroups:
  # Non-secret production invariants. These are here rather than in the
  # dashboard precisely because they are governance decisions: an invite-only
  # beta that requires analysis consent and never writes media to a local
  # disk. Changing one of them should be a reviewed commit, not a text field
  # somebody edited on a Tuesday.
  #
  # Every secret — database URLs, Supabase keys, the Gemini key, the Sentry
  # DSN, the scheduler token — belongs to glamgenius-production-secrets, which
  # is created in the dashboard and is deliberately absent from this file.
  - name: glamgenius-production-invariants
    envVars:
      - key: APP_ENV
        value: production
      - key: INVITE_REQUIRED
        value: "true"
      - key: REQUIRE_ANALYSIS_CONSENT
        value: "true"
      - key: MEDIA_STORAGE_BACKEND
        value: supabase
      - key: MEDIA_ALLOW_LOCAL_IN_PRODUCTION
        value: "false"
