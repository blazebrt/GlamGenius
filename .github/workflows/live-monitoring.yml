# Live monitoring proof (Fix 8, WP5).
#
# Manually dispatched only. Sends a synthetic test event to Sentry, waits for
# it to appear via the Sentry API, and verifies the scrubber removed a
# synthetic secret field.
#
# Never triggered by push, PR, or schedule.
# Never uses customer data — the events are synthetic and generated fresh
# each dispatch.

name: Live monitoring proof

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-monitoring
  cancel-in-progress: false

jobs:
  probe:
    name: Sentry event round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GLAMGENIUS_LIVE_MONITORING_ENABLED: "true"
      SENTRY_BACKEND_DSN: ${{ secrets.SENTRY_BACKEND_DSN }}
      SENTRY_LOOKUP_TOKEN: ${{ secrets.SENTRY_LOOKUP_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_ENVIRONMENT: "live-probe"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify secrets present (redacted)
        run: |
          for v in SENTRY_BACKEND_DSN SENTRY_LOOKUP_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            val="${!v:-}"
            if [ -z "$val" ]; then
              echo "$v secret is not configured on the repo." >&2
              exit 1
            fi
            echo "$v is present (length=${#val})"
          done
      - name: Run monitoring probe
        run: python scripts/live_monitoring_probe.py --report /tmp/live_monitoring_report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-monitoring-report
          path: /tmp/live_monitoring_report.json
