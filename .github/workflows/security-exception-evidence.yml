# TEMPORARY — September 2026 security exception expiry review.
#
# This workflow exists only to produce evidence for the expiry review of
# .trivy-exceptions.yaml. It builds the production image and reports, from
# inside that freshly built image:
#
#   * the installed version of every package an exception names
#   * what the live Debian repositories currently offer for it
#   * every HIGH/CRITICAL Trivy finding with NO ignore file applied
#
# The unfiltered scan is discovery, not a gate: an exception can only be
# reconciled against what the scanner reports before suppression. The real
# gate is `container-scan` in ci.yml, which is untouched, still runs with
# exit-code 1, and still applies the generated .trivyignore.
#
# A zero-finding scan proves nothing on its own -- a vulnerability database
# that failed to load reports zero too. So the same database, in the same run,
# is also pointed at the pinned base image the Dockerfile starts from. The
# base image is known to carry findings that `apt-get upgrade` resolves, so a
# non-empty base result alongside an empty built result is what makes the
# empty one mean something.
#
# DELETE THIS FILE once the review PR's evidence is captured.

name: Security exception evidence (temporary)

on:
  push:
    branches:
      - maintenance/security-exception-expiry-review-2026-09

permissions:
  contents: read

env:
  # So the database Trivy actually used can be read back afterwards.
  TRIVY_CACHE_DIR: /tmp/trivy-cache
  BASE_IMAGE: python@sha256:90744cff8f32887f075c47d747a173ff333e9e98801667af93c357fa9f5e28ff

jobs:
  evidence:
    name: Fresh image + unfiltered scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build production image
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t glamgenius-backend:evidence \
            backend/ > /tmp/build.log 2>&1
          tail -5 /tmp/build.log

      - name: Collect package evidence from inside the image
        run: |
          {
            echo "=== build finished at ==="
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo
            echo "=== base image digest pinned in backend/Dockerfile ==="
            grep -n 'FROM python@sha256' backend/Dockerfile
            echo
            echo "=== os-release / debian_version ==="
            docker run --rm glamgenius-backend:evidence sh -c \
              'grep PRETTY_NAME /etc/os-release; cat /etc/debian_version'
            echo
            echo "=== installed versions of every excepted package ==="
            docker run --rm --user 0 glamgenius-backend:evidence bash -c '
              for pkg in libncursesw6 libtinfo6 ncurses-base ncurses-bin \
                         gzip libacl1 perl-base libssl3t64 openssl \
                         libsqlite3-0 libsystemd0 libudev1 systemd \
                         bsdutils libblkid1 liblastlog2-2 libmount1 \
                         libsmartcols1 libuuid1 login mount util-linux ; do
                printf "%-16s " "$pkg"
                dpkg-query -W -f="installed=\${Version} src=\${source:Package}/\${source:Version}\n" "$pkg" 2>/dev/null \
                  || echo "NOT INSTALLED"
              done
            '
            echo
            echo "=== candidate versions from the live Debian repositories ==="
            docker run --rm --user 0 glamgenius-backend:evidence bash -c '
              apt-get update -qq >/dev/null 2>&1
              for pkg in libncursesw6 libtinfo6 ncurses-base ncurses-bin \
                         gzip libacl1 perl-base libssl3t64 openssl \
                         libsqlite3-0 libsystemd0 libudev1 systemd \
                         bsdutils libblkid1 liblastlog2-2 libmount1 \
                         libsmartcols1 libuuid1 login mount util-linux ; do
                inst=$(apt-cache policy "$pkg" 2>/dev/null | sed -n "s/^  Installed: //p")
                cand=$(apt-cache policy "$pkg" 2>/dev/null | sed -n "s/^  Candidate: //p")
                printf "%-16s installed=%-40s candidate=%s\n" "$pkg" "${inst:-none}" "${cand:-none}"
              done
            '
          } > /tmp/packages.txt 2>&1
          echo "collected $(wc -l < /tmp/packages.txt) lines"

      - name: Trivy — built image, HIGH/CRITICAL, no ignore file
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.30.0
        with:
          image-ref: glamgenius-backend:evidence
          format: json
          output: /tmp/built-high.json
          severity: HIGH,CRITICAL
          scanners: vuln
          # Discovery, not a gate: this step has to report everything rather
          # than stop at the first finding. ci.yml's container-scan is the
          # gate and still fails on any unignored HIGH or CRITICAL.
          exit-code: 0

      - name: Trivy — pinned BASE image, HIGH/CRITICAL (positive control)
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.30.0
        with:
          image-ref: ${{ env.BASE_IMAGE }}
          format: json
          output: /tmp/base-high.json
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: 0

      - name: Trivy — built image, every severity (scanner sanity)
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.30.0
        with:
          image-ref: glamgenius-backend:evidence
          format: json
          output: /tmp/built-all.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
          exit-code: 0

      - name: Evidence
        run: |
          echo "############ VULNERABILITY DATABASE ############"
          find "$TRIVY_CACHE_DIR" -name metadata.json -print -exec cat {} \; 2>/dev/null || true
          echo
          echo "############ PACKAGE EVIDENCE ############"
          cat /tmp/packages.txt
          echo
          python3 - <<'PY'
          import json, yaml

          def load(path):
              with open(path) as handle:
                  return json.load(handle)

          def rows(report):
              out = []
              for result in report.get("Results") or []:
                  for v in result.get("Vulnerabilities") or []:
                      out.append((
                          v.get("VulnerabilityID"),
                          v.get("Severity"),
                          v.get("PkgName"),
                          v.get("InstalledVersion"),
                          v.get("FixedVersion") or "-",
                          v.get("Status") or "-",
                      ))
              return sorted(out)

          def describe(name, report):
              meta = report.get("Metadata") or {}
              os_info = meta.get("OS") or {}
              results = report.get("Results") or []
              print(f"--- {name}")
              print(f"    ArtifactName : {report.get('ArtifactName')}")
              print(f"    OS           : {os_info.get('Family')} {os_info.get('Name')}")
              print(f"    Result targets: {[r.get('Target') for r in results]}")
              print(f"    Class/Type    : {[(r.get('Class'), r.get('Type')) for r in results]}")

          built_high = load("/tmp/built-high.json")
          base_high = load("/tmp/base-high.json")
          built_all = load("/tmp/built-all.json")

          print("############ SCAN IDENTITY ############")
          describe("built image, HIGH/CRITICAL", built_high)
          describe("pinned base image, HIGH/CRITICAL", base_high)
          describe("built image, all severities", built_all)

          print()
          print("############ POSITIVE CONTROL ############")
          base_rows = rows(base_high)
          built_all_rows = rows(built_all)
          print(f"pinned base image HIGH/CRITICAL rows : {len(base_rows)}")
          print(f"built image rows at ALL severities   : {len(built_all_rows)}")
          print("A loaded, current database must find something in at least one")
          print("of these. Zero in both would mean the scan proved nothing.")
          print()
          print("first 40 base-image HIGH/CRITICAL rows:")
          for r in base_rows[:40]:
              print("   ", " ".join(str(x) for x in r))
          print()
          print("built-image rows at all severities:")
          for r in built_all_rows:
              print("   ", " ".join(str(x) for x in r))

          print()
          print("############ BUILT IMAGE, HIGH/CRITICAL, NO IGNORE FILE ############")
          built_rows = rows(built_high)
          print(f"total rows: {len(built_rows)}")
          for r in built_rows:
              print("   ", " ".join(str(x) for x in r))

          print()
          print("############ RECONCILIATION ############")
          reported = {r[0] for r in built_rows}
          registry = yaml.safe_load(open(".trivy-exceptions.yaml"))
          excepted = {e["cve_or_advisory_id"] for e in registry["exceptions"]}
          print("exceptions the fresh scan NO LONGER reports:")
          for cve in sorted(excepted - reported):
              print("   ", cve)
          print("exceptions the fresh scan STILL reports:")
          for cve in sorted(excepted & reported):
              print("   ", cve)
          print("reported but NOT excepted (would fail the gate today):")
          for cve in sorted(reported - excepted):
              print("   ", cve)
          PY

      # The Python audit carries eight suppressions too, as bare
      # `--ignore-vuln` flags inline in ci.yml with no registry, no owner, no
      # expiry and no recorded reachability argument -- so nothing forces them
      # to be reviewed the way the Node and Trivy registries did. This step
      # only measures what they are currently hiding; changing them is its own
      # PR and is not in this diff.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: pip-audit WITHOUT the inline ignore list (discovery)
        working-directory: backend
        run: |
          pip install pip-audit==2.7.3
          echo "############ pip-audit, no --ignore-vuln flags ############"
          pip-audit -r requirements.txt --vulnerability-service osv \
            --format=json > /tmp/pip-audit-unfiltered.json || true
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/pip-audit-unfiltered.json"))
          ignored = {
              "PYSEC-2026-1845", "PYSEC-2026-161", "PYSEC-2026-1941",
              "PYSEC-2026-1943", "PYSEC-2026-2280", "PYSEC-2026-2281",
              "PYSEC-2026-248", "PYSEC-2026-249",
          }
          found = {}
          for dep in report.get("dependencies") or []:
              for vuln in dep.get("vulns") or []:
                  found[vuln["id"]] = (
                      dep.get("name"), dep.get("version"),
                      ",".join(vuln.get("fix_versions") or []) or "-",
                      (vuln.get("aliases") or []),
                  )
          print(f"total advisories reported: {len(found)}")
          for vid in sorted(found):
              name, version, fixes, aliases = found[vid]
              flag = "IGNORED-IN-CI" if vid in ignored else "not ignored"
              print(f"  {vid:<20} {flag:<14} {name}=={version} fix={fixes} aliases={aliases}")
          print()
          print("ignore-list entries no longer reported (dead suppressions):")
          for vid in sorted(ignored - set(found)):
              print("   ", vid)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-evidence
          path: |
            /tmp/built-high.json
            /tmp/base-high.json
            /tmp/built-all.json
            /tmp/packages.txt
            /tmp/pip-audit-unfiltered.json
          retention-days: 7
