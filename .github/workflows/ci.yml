      BETA_SCAN_LIMIT_PER_MONTH: "60"
      BETA_STYLE_LIMIT_PER_MONTH: "60"
      BETA_SHOPPING_CHECK_LIMIT_PER_MONTH: "60"
      ALLOWED_ORIGINS: "http://localhost:8081"
      APP_ENV: "test"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: cd backend && alembic upgrade head
      - name: Account-deletion state machine tests
        working-directory: backend
        run: pytest -q tests/test_account_deletion*.py -v

  critical-journey:
    name: Critical journey
    needs: scope
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-one
      SUPABASE_JWT_ISSUER: https://ci-project.supabase.co/auth/v1
      SUPABASE_JWKS_URL: https://ci-project.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_STORAGE_BUCKET: glamgenius-media
      SUPABASE_ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000001
      GEMINI_API_KEY: ""
      REQUIRE_ANALYSIS_CONSENT: "false"
      CONSENT_VERSION: "ci-test"
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_ROOT: /tmp/media-test
      INVITE_REQUIRED: "false"
      BETA_AI_REQUESTS_PER_HOUR: "60"
      BETA_SCAN_LIMIT_PER_MONTH: "60"
      BETA_STYLE_LIMIT_PER_MONTH: "60"
      BETA_SHOPPING_CHECK_LIMIT_PER_MONTH: "60"
      ALLOWED_ORIGINS: "http://localhost:8081"
      APP_ENV: "test"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: cd backend && alembic upgrade head
      - name: Critical journey tests
        working-directory: backend
        run: pytest -q tests/test_critical_journey*.py -v

  # ---- Single stable pull-request gate -------------------------------------
  # The PR gate is the only recommended branch-protection check.  It owns the
  # lightweight policy work and aggregates every implementation job that can
  # be required by PR scope.
  pr-gate:
    name: PR gate
    needs: [scope, backend-tests, frontend-tests, backend-release, auth-security, health-readiness, docker-build, render-image, container-scan, sbom]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce scope detection result first
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Scope detection result is $SCOPE_RESULT; refusing to interpret missing outputs as no work"
            exit 1
          fi
          echo "Scope detection succeeded"
      - name: Checkout full history for PR policy checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No MongoDB references
        run: |
          if grep -rn "mongodb\|MongoClient\|pymongo\|motor" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: MongoDB references found in backend code"
            exit 1
          fi
          echo "PASS: no MongoDB references"
      - name: No MinIO or S3 compatibility
        run: |
          if grep -rn "minio\|MinIO\|boto3\|s3_client\|S3_BUCKET" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: MinIO/S3 references found"
            exit 1
          fi
          echo "PASS: no MinIO/S3 references"
      - name: No payment or billing code
        run: |
          if grep -rn "stripe\|Stripe\|payment_intent\|billing\|subscription" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: payment/billing references found"
            exit 1
          fi
          echo "PASS: no payment/billing references"
      - name: No legacy terminology
        run: |
          if grep -rnE "Package [A-Z]|legacy project|temporary compatibility" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: legacy terminology found"
            exit 1
          fi
          echo "PASS: no legacy terminology"
      - name: "Workflow policy: immutable action pins"
        run: |
          if grep -RInE "uses:[[:space:]]*[^[:space:]]+@(master|main|latest)($|[[:space:]])" .github/workflows/; then
            echo "FAIL: mutable GitHub Action reference found"
            exit 1
          fi
          if grep -RInE "uses:[[:space:]]*[^[:space:]]+@[0-9A-Fa-f]{40}($|[[:space:]]+#)" .github/workflows/ | wc -l | grep -q '^0$'; then
            echo "FAIL: no immutable GitHub Action SHA pins found"
            exit 1
          fi
          echo "PASS: GitHub Actions use immutable SHA pins"
      - name: Enforce all relevant implementation results
        env:
          BACKEND_SCOPE: ${{ needs.scope.outputs.backend }}
          SCHEMA_SCOPE: ${{ needs.scope.outputs.schema }}
          FRONTEND_SCOPE: ${{ needs.scope.outputs.frontend }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python_deps }}
          NODE_SCOPE: ${{ needs.scope.outputs.node_deps }}
          CONTAINER_SCOPE: ${{ needs.scope.outputs.container }}
          SECURITY_SCOPE: ${{ needs.scope.outputs.security }}
          RELEASE_SCOPE: ${{ needs.scope.outputs.release }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          RELEASE_RESULT: ${{ needs.backend-release.result }}
          AUTH_RESULT: ${{ needs.auth-security.result }}
          HEALTH_RESULT: ${{ needs.health-readiness.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          RENDER_IMAGE_RESULT: ${{ needs.render-image.result }}
          TRIVY_RESULT: ${{ needs.container-scan.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
        run: |
          require_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "$label result is $result"
              exit 1
            fi
          }
          if [[ "$BACKEND_SCOPE" == "true" || "$SCHEMA_SCOPE" == "true" || "$PYTHON_SCOPE" == "true" ]]; then
            require_success "Backend canonical job" "$BACKEND_RESULT"
          fi
          if [[ "$FRONTEND_SCOPE" == "true" || "$NODE_SCOPE" == "true" ]]; then
            require_success "Frontend canonical job" "$FRONTEND_RESULT"
          fi
          if [[ "$CONTAINER_SCOPE" == "true" ]]; then
            require_success "Docker build" "$DOCKER_RESULT"
            # The image Render actually deploys. Without this line a green PR
            # could have built only backend/Dockerfile.
            require_success "Render production image" "$RENDER_IMAGE_RESULT"
            require_success "Trivy" "$TRIVY_RESULT"
            require_success "SBOM" "$SBOM_RESULT"
          fi
          if [[ "$SECURITY_SCOPE" == "true" ]]; then
            require_success "Authentication security" "$AUTH_RESULT"
            require_success "Health and readiness" "$HEALTH_RESULT"
          fi
          if [[ "$RELEASE_SCOPE" == "true" ]]; then
            require_success "Backend release" "$RELEASE_RESULT"
          fi
          echo "PR gate passed: all relevant implementation and policy checks succeeded"
