# GlamGenius CI — Supabase V2 architecture.
#
# Everything in this workflow is reproducible without any paid credential
# (no Gemini key, no S3 credentials, no calendar OAuth client, no push
# provider, no monitoring DSN, no real Supabase project). Supabase Auth is
# stubbed in tests by signing JWTs with a test HS256 secret; the backend
# test secret and no JWKS URL is reachable in CI.
#
# GitHub Actions are pinned to full commit SHAs. The tag comment after each
# SHA is guidance for the human reviewer.
#
# Service container images (postgres) are pinned to specific minor tags.
#
# Every required job in this workflow blocks merge. There is no
# `continue-on-error` on any merge-gate step.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---- Backend --------------------------------------------------------------
  backend-tests:
    name: Backend unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-one
      SUPABASE_JWT_ISSUER: https://ci-project.supabase.co/auth/v1
      SUPABASE_JWKS_URL: https://ci-project.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_STORAGE_BUCKET: glamgenius-media
      SUPABASE_ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000001
      GEMINI_API_KEY: ""
      REQUIRE_ANALYSIS_CONSENT: "false"
      CONSENT_VERSION: "ci-test"
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_ROOT: /tmp/media-test
      INVITE_REQUIRED: "false"
      BETA_AI_REQUESTS_PER_HOUR: "60"
      BETA_SCAN_LIMIT_PER_MONTH: "60"
      BETA_STYLE_LIMIT_PER_MONTH: "60"
      BETA_SHOPPING_CHECK_LIMIT_PER_MONTH: "60"
      ALLOWED_ORIGINS: "http://localhost:8081"
      APP_ENV: "test"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade from empty database
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic check (schema drift)
        working-directory: backend
        run: alembic check
      - name: Reference-data seed (idempotent)
        working-directory: backend
        run: |
          python -m app.bootstrap.reference_data
          python -m app.bootstrap.reference_data
      - name: Run tests
        working-directory: backend
        run: pytest -q tests --junitxml=/tmp/pytest-report.xml
      - name: Run invite-reservation tests with INVITE_REQUIRED=true
        working-directory: backend
        env:
          INVITE_REQUIRED: "true"
        run: pytest -q tests/test_invite_reservation.py tests/test_invite_bypass_regression.py
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-report
          path: /tmp/pytest-report.xml

  backend-lint:
    name: Backend zero-warning lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run Ruff (zero warnings)
        working-directory: backend
        run: ruff check .
      - name: Block unpinned GitHub Actions
        run: |
          if grep -rnE "uses:.*@[m]aster|uses:.*@[m]ain" .github/workflows/; then
            echo "FAIL: Unpinned GitHub Actions found (using @master or @main)"
            exit 1
          fi
          echo "PASS: No unpinned GitHub Actions found"

  backend-release:
    name: Backend release command test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-one
      SUPABASE_JWT_ISSUER: https://ci-project.supabase.co/auth/v1
      SUPABASE_JWKS_URL: https://ci-project.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_STORAGE_BUCKET: glamgenius-media
      SUPABASE_ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000001
      GEMINI_API_KEY: "fake-key"
      REQUIRE_ANALYSIS_CONSENT: "true"
      CONSENT_VERSION: "ci-test"
      MEDIA_STORAGE_BACKEND: supabase
      MEDIA_LOCAL_ROOT: /tmp/media-test
      INVITE_REQUIRED: "true"
      BETA_AI_REQUESTS_PER_HOUR: "60"
      BETA_SCAN_LIMIT_PER_MONTH: "60"
      BETA_STYLE_LIMIT_PER_MONTH: "60"
      BETA_SHOPPING_CHECK_LIMIT_PER_MONTH: "60"
      ALLOWED_ORIGINS: "http://localhost:8081"
      APP_ENV: "test"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Test release command
        working-directory: backend
        run: python -m app.release
        env:
          APP_ENV: test
          GEMINI_API_KEY: "fake-key"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "fake-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "fake-service-role-key"
          SUPABASE_JWT_ISSUER: "https://test.supabase.co/auth/v1"
          SUPABASE_JWKS_URL: "https://test.supabase.co/auth/v1/jwks"
          POSTGRES_URL: "postgresql+asyncpg://glamgenius:glamgenius@0.0.0.0:5432/glamgenius_test"
          ALLOWED_ORIGINS: "https://glamgenius.app"
          SUPABASE_STORAGE_BUCKET: "media"
          SENTRY_BACKEND_DSN: "https://fake@sentry.io/123"
          INVITE_REQUIRED: "true"
          REQUIRE_ANALYSIS_CONSENT: "true"
          CONSENT_VERSION: "2026-01-01"

  # ---- Alembic round-trip (upgrade → downgrade one → re-upgrade) ------------
  alembic-round-trip:
    name: Alembic round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Downgrade to base, then re-upgrade
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  # ---- Frontend -------------------------------------------------------------
  frontend-tests:
    name: Frontend Jest + TypeScript + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: TypeScript
        working-directory: frontend
        run: yarn typecheck
      - name: Lint (blocking, zero-warning budget)
        working-directory: frontend
        # `expo lint` runs eslint. A warning here is a merge-blocker.
        run: yarn lint --max-warnings=0
      - name: Jest
        working-directory: frontend
        # `--passWithNoTests` is intentionally NOT set.
        run: yarn test --ci --watchAll=false

  # ---- Mobile: Android bundle validation (blocking) ------------------------
  # Verifies the Expo project compiles for Android as a Metro bundle. This is
  # the smallest blocking check that proves the mobile shell still builds. A
  # full APK/AAB build via EAS runs on release cuts, not on every PR.
  mobile-android-bundle:
    name: Mobile Android Metro bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Metro Android bundle (verifies native shell compiles)
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
        run: |
          npx expo export --platform android --output-dir /tmp/expo-android || \
            npx expo export --platform android

  # ---- Expo config + web export --------------------------------------------
  # Non-blocking web export as a shared-code smoke test. Web export is NOT
  # mobile validation — see ``mobile-android-bundle`` above for the blocking
  # native check, and ``docs/stabilisation/SUPABASE_HARDENING_PACKAGES_BCD.md``
  # for the full mobile validation matrix.
  expo-export:
    name: Expo web export (shared-code smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Expo config sanity
        working-directory: frontend
        run: npx expo config --type public > /dev/null
      - name: Export web build
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
        run: npx expo export --platform web

  # ---- Secret scan ---------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Python dependency vulnerability scan --------------------------------
  # Blocks merge on HIGH or CRITICAL vulnerabilities. Lower-severity findings
  # (LOW / MEDIUM / UNKNOWN) are recorded in the artifact for backlog triage.
  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit requirements (strict — fail on any advisory not on the documented ignore list)
        working-directory: backend
        # See the Stabilisation Report backlog for the rationale on each ignored ID.
        run: |
          pip-audit -r requirements.txt \
            --vulnerability-service osv \
            --strict \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249
      - name: Full audit report (informational, uploaded on any run)
        if: always()
        working-directory: backend
        run: pip-audit -r requirements.txt --vulnerability-service osv --format=json > /tmp/pip-audit.json || true
      - name: Upload full pip-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-report
          path: /tmp/pip-audit.json

  # ---- Node dependency vulnerability scan ----------------------------------
  npm-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: yarn audit (fail on high or critical)
        working-directory: frontend
        run: |
          set +e
          yarn audit --level high --json > /tmp/yarn-audit.json
          code=$?
          echo "yarn audit exit code = $code (bitmask: 1=info,2=low,4=moderate,8=high,16=critical)"
          if [ "$code" -ge 8 ]; then
            echo "yarn audit reported a HIGH or CRITICAL advisory — failing the build."
            exit 1
          fi
          exit 0
      - name: Upload yarn-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yarn-audit-report
          path: /tmp/yarn-audit.json

  # ---- Production Docker build -----------------------------------------------
  docker-build:
    name: Production Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build production image
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t glamgenius-backend:ci \
            backend/
      - name: Verify non-root user
        run: |
          USER_ID=$(docker run --rm glamgenius-backend:ci id -u)
          echo "Container runs as UID=$USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "FAIL: container runs as root"
            exit 1
          fi
      - name: Verify no compiler in runtime image
        run: |
          if docker run --rm glamgenius-backend:ci which gcc 2>/dev/null; then
            echo "FAIL: gcc found in runtime image"
            exit 1
          fi
          echo "PASS: no compiler in runtime image"
      - name: Verify COMMIT_SHA label
        run: |
          SHA=$(docker run --rm glamgenius-backend:ci printenv COMMIT_SHA)
          echo "COMMIT_SHA=$SHA"
          if [ "$SHA" != "${{ github.sha }}" ]; then
            echo "FAIL: COMMIT_SHA mismatch"
            exit 1
          fi
      - name: Save image for downstream jobs
        run: docker save glamgenius-backend:ci | gzip > /tmp/glamgenius-backend-ci.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image
          path: /tmp/glamgenius-backend-ci.tar.gz
          retention-days: 1

  # ---- Container vulnerability scan (Trivy) ----------------------------------
  container-scan:
    name: Container vulnerability scan
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load < /tmp/glamgenius-backend-ci.tar.gz
      - name: Validate Trivy Exceptions
        run: python scripts/validate_trivy_exceptions.py
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.30.0
        with:
          image-ref: glamgenius-backend:ci
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.30.0
        with:
          image-ref: glamgenius-backend:ci
          format: json
          output: /tmp/trivy-report.json
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: trivy-report
          path: /tmp/trivy-report.json

  # ---- SBOM generation -------------------------------------------------------
  sbom:
    name: SBOM generation
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load < /tmp/glamgenius-backend-ci.tar.gz
      - name: Generate Backend Container SBOM (SPDX JSON)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.2
        with:
          image: glamgenius-backend:ci
          format: spdx-json
          output-file: /tmp/backend-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sbom
          path: /tmp/backend-sbom.spdx.json

      - name: Generate Frontend Dependency SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.2
        with:
          path: frontend
          format: cyclonedx-json
          output-file: /tmp/frontend-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-sbom
          path: /tmp/frontend-sbom.cdx.json


  # ---- Legacy and payment absence --------------------------------------------
  legacy-absence:
    name: Legacy and payment absence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No MongoDB references
        run: |
          if grep -rn "mongodb\|MongoClient\|pymongo\|motor" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: MongoDB references found in backend code"
            exit 1
          fi
          echo "PASS: no MongoDB references"
      - name: No MinIO or S3 compatibility
        run: |
          if grep -rn "minio\|MinIO\|boto3\|s3_client\|S3_BUCKET" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: MinIO/S3 references found"
            exit 1
          fi
          echo "PASS: no MinIO/S3 references"
      - name: No payment or billing code
        run: |
          if grep -rn "stripe\|Stripe\|payment_intent\|billing\|subscription" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: payment/billing references found"
            exit 1
          fi
          echo "PASS: no payment/billing references"
      - name: No legacy terminology
        run: |
          if grep -rnE "Package [A-Z]|legacy project|temporary compatibility" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: legacy terminology found"
            exit 1
          fi
          echo "PASS: no legacy terminology"

  # ---- Focused test gates (run from the full backend suite) ------------------
  # These re-run targeted subsets so failures are immediately attributable.

  auth-security:
    name: Authentication security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-one
      SUPABASE_JWT_ISSUER: https://ci-project.supabase.co/auth/v1
