# GlamGenius CI — Supabase V2 architecture.
#
# Everything in this workflow is reproducible without any paid credential
# (no Gemini key, no S3 credentials, no calendar OAuth client, no push
# provider, no monitoring DSN, no real Supabase project). Supabase Auth is
# stubbed in tests by signing JWTs with a test HS256 secret; the backend
# test secret and no JWKS URL is reachable in CI.
#
# GitHub Actions are pinned to full commit SHAs. The tag comment after each
# SHA is guidance for the human reviewer.
#
# Service container images (postgres) are pinned to specific minor tags.
#
# Every required job in this workflow blocks merge. There is no
# `continue-on-error` on any merge-gate step.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Scope is deliberately tiny: one checkout and one git diff.  It is the
  # only job that runs before the path-aware PR gate and supplies the explicit
  # full (main/manual), scheduled-audit, or PR merge-base policy.
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    # Two minutes was right when this job was one checkout and one git diff.
    # It now also stands up the pinned interpreter and runs the knowledge-pack
    # inventory gate, which together take seconds on a warm toolcache and
    # noticeably longer on a cold one. A governance gate that fails on runner
    # variance teaches people to re-run rather than to read, so the ceiling is
    # raised — but only to five minutes, because this job still has no
    # dependency install, no database and no network work to do.
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      schema: ${{ steps.scope.outputs.schema }}
      frontend: ${{ steps.scope.outputs.frontend }}
      mobile: ${{ steps.scope.outputs.mobile }}
      web: ${{ steps.scope.outputs.web }}
      python_deps: ${{ steps.scope.outputs.python_deps }}
      node_deps: ${{ steps.scope.outputs.node_deps }}
      container: ${{ steps.scope.outputs.container }}
      security: ${{ steps.scope.outputs.security }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - name: Checkout full history for merge-base diff
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Runs here, before the scope is emitted, because this is the only job
      # that always runs. A scope script that wrongly reported container=false
      # would otherwise be able to skip the job holding its own test.
      - name: Container scope regression test
        run: bash .github/scripts/detect-ci-scope.test.sh
      # The knowledge-pack inventory gate, and the reason it lives here rather
      # than in a job of its own.
      #
      # It is deliberately unconditional. It is not gated on changed paths, it
      # sits in the one job that always runs, and it runs before the step that
      # emits the path scope — so no scope rule, correct or buggy, can decide
      # that the inventory does not need checking today. Governance a scope
      # rule can switch off is not governance: the case that matters is a pack
      # that has quietly become invalid, or two packs that have collided,
      # which by definition is a pull request nobody thought was about packs.
      # An invalid inventory fails this job, and the PR gate refuses to
      # interpret a failed scope job as "nothing needed to run".
      #
      # No dependency install appears above it because it needs none. The
      # inspector reads committed source and parses it with `ast`: it imports
      # no pack, opens no database, makes no network call and reads no
      # credential. See docs/architecture/FIRST_PRODUCTION_KNOWLEDGE_PACK.md.
      - name: Set up Python for the knowledge-pack gate
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Knowledge-pack governance
        run: python scripts/inspect_knowledge_packs.py --json
      - id: scope
        name: Detect changed paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/detect-ci-scope.sh "$BASE_SHA" "$HEAD_SHA" "$EVENT_NAME"

  # ---- Backend --------------------------------------------------------------
  backend-tests:
    name: Backend unit + integration
    needs: scope
    if: needs.scope.outputs.backend == 'true' || needs.scope.outputs.schema == 'true' || (github.event_name == 'pull_request' && needs.scope.outputs.python_deps == 'true')
    runs-on: ubuntu-latest
    # The growing canonical PostgreSQL suite can reach the former 25-minute
    # ceiling under normal runner variance; its command and coverage are unchanged.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-one
      SUPABASE_JWT_ISSUER: https://ci-project.supabase.co/auth/v1
      SUPABASE_JWKS_URL: https://ci-project.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_STORAGE_BUCKET: glamgenius-media
      SUPABASE_ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000001
      GEMINI_API_KEY: ""
      REQUIRE_ANALYSIS_CONSENT: "false"
      CONSENT_VERSION: "ci-test"
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_ROOT: /tmp/media-test
      INVITE_REQUIRED: "false"
      BETA_AI_REQUESTS_PER_HOUR: "60"
      BETA_SCAN_LIMIT_PER_MONTH: "60"
      BETA_STYLE_LIMIT_PER_MONTH: "60"
      BETA_SHOPPING_CHECK_LIMIT_PER_MONTH: "60"
      ALLOWED_ORIGINS: "http://localhost:8081"
      APP_ENV: "test"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade from empty database
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic check (schema drift)
        working-directory: backend
        run: alembic check
      - name: Alembic round-trip (schema PR)
        if: github.event_name == 'pull_request' && needs.scope.outputs.schema == 'true'
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Install pip-audit for dependency PR
        if: github.event_name == 'pull_request' && needs.scope.outputs.python_deps == 'true'
        run: pip install pip-audit==2.7.3
      - name: Python dependency audit (dependency PR)
        if: github.event_name == 'pull_request' && needs.scope.outputs.python_deps == 'true'
        working-directory: backend
        run: |
          pip-audit -r requirements.txt \
            --vulnerability-service osv \
            --strict
      - name: Run Ruff on pull requests
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: ruff check .
      - name: Reference-data seed (idempotent)
        working-directory: backend
        run: |
          python -m app.bootstrap.reference_data
          python -m app.bootstrap.reference_data
      - name: Run tests
        working-directory: backend
        run: pytest -q tests --junitxml=/tmp/pytest-report.xml
      - name: Run invite-reservation tests with INVITE_REQUIRED=true
        working-directory: backend
        env:
          INVITE_REQUIRED: "true"
        run: pytest -q tests/test_invite_reservation.py tests/test_invite_bypass_regression.py
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-report
          path: /tmp/pytest-report.xml

  backend-lint:
    name: Backend zero-warning lint
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run Ruff (zero warnings)
        working-directory: backend
        run: ruff check .
      - name: Block unpinned GitHub Actions
        run: |
          if grep -rnE "uses:.*@[m]aster|uses:.*@[m]ain" .github/workflows/; then
            echo "FAIL: Unpinned GitHub Actions found (using @master or @main)"
            exit 1
          fi
          echo "PASS: No unpinned GitHub Actions found"

  backend-release:
    name: Backend release command test
    needs: scope
    if: needs.scope.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-one
      SUPABASE_JWT_ISSUER: https://ci-project.supabase.co/auth/v1
      SUPABASE_JWKS_URL: https://ci-project.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_STORAGE_BUCKET: glamgenius-media
      SUPABASE_ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000001
      GEMINI_API_KEY: "fake-key"
      REQUIRE_ANALYSIS_CONSENT: "true"
      CONSENT_VERSION: "ci-test"
      MEDIA_STORAGE_BACKEND: supabase
      MEDIA_LOCAL_ROOT: /tmp/media-test
      INVITE_REQUIRED: "true"
      BETA_AI_REQUESTS_PER_HOUR: "60"
      BETA_SCAN_LIMIT_PER_MONTH: "60"
      BETA_STYLE_LIMIT_PER_MONTH: "60"
      BETA_SHOPPING_CHECK_LIMIT_PER_MONTH: "60"
      ALLOWED_ORIGINS: "http://localhost:8081"
      APP_ENV: "test"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Test release command
        working-directory: backend
        run: python -m app.release
        env:
          APP_ENV: test
          GEMINI_API_KEY: "fake-key"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "fake-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "fake-service-role-key"
          SUPABASE_JWT_ISSUER: "https://test.supabase.co/auth/v1"
          SUPABASE_JWKS_URL: "https://test.supabase.co/auth/v1/jwks"
          POSTGRES_URL: "postgresql+asyncpg://glamgenius:glamgenius@0.0.0.0:5432/glamgenius_test"
          ALLOWED_ORIGINS: "https://glamgenius.app"
          SUPABASE_STORAGE_BUCKET: "media"
          SENTRY_BACKEND_DSN: "https://fake@sentry.io/123"
          INVITE_REQUIRED: "true"
          REQUIRE_ANALYSIS_CONSENT: "true"
          CONSENT_VERSION: "2026-01-01"

  # ---- Alembic round-trip (upgrade → downgrade one → re-upgrade) ------------
  alembic-round-trip:
    name: Alembic round-trip
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Downgrade to base, then re-upgrade
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  # ---- Frontend -------------------------------------------------------------
  frontend-tests:
    name: Frontend Jest + TypeScript + lint
    needs: scope
    if: needs.scope.outputs.frontend == 'true' || (github.event_name == 'pull_request' && needs.scope.outputs.node_deps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: TypeScript
        working-directory: frontend
        run: yarn typecheck
      - name: Lint (blocking, zero-warning budget)
        working-directory: frontend
        # `expo lint` runs eslint. A warning here is a merge-blocker.
        run: yarn lint --max-warnings=0
      - name: Jest
        working-directory: frontend
        # `--passWithNoTests` is intentionally NOT set.
        run: yarn test --ci --watchAll=false
      - name: Metro Android bundle (runtime frontend PR)
        if: github.event_name == 'pull_request' && needs.scope.outputs.mobile == 'true'
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
        run: npx expo export --platform android --output-dir /tmp/expo-android
      - name: Expo web export (runtime frontend PR)
        if: github.event_name == 'pull_request' && needs.scope.outputs.web == 'true'
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
        run: npx expo export --platform web
      - name: Node audit gate tests (dependency PR)
        # The gate's own tests belong on the path that can change it. Without
        # this, a PR could alter the validator or the audit runner and only be
        # caught after merge, by the push-only job.
        if: github.event_name == 'pull_request' && needs.scope.outputs.node_deps == 'true'
        run: node --test security/validate-node-audit.test.js security/run-node-audit.test.js
      - name: Node dependency audit (dependency PR)
        if: github.event_name == 'pull_request' && needs.scope.outputs.node_deps == 'true'
        working-directory: frontend
        run: |
          # run-node-audit.js retries an audit that did not run to completion --
          # only a valid auditSummary establishes completion -- and carries any
          # advisory seen on an incomplete attempt forward, so retries can
          # recover completeness but never erase a finding. The validator below
          # remains the sole pass/fail authority.
          node ../security/run-node-audit.js /tmp/yarn-audit.json
          node ../security/validate-node-audit.js /tmp/yarn-audit.json ../security/node-audit-exceptions.json ../security/node-audit-false-positives.json

  # ---- Mobile: Android bundle validation (blocking) ------------------------
  # Verifies the Expo project compiles for Android as a Metro bundle. This is
  # the smallest blocking check that proves the mobile shell still builds. A
  # full APK/AAB build via EAS runs on release cuts, not on every PR.
  mobile-android-bundle:
    name: Mobile Android Metro bundle
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Metro Android bundle (verifies native shell compiles)
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
        run: |
          npx expo export --platform android --output-dir /tmp/expo-android || \
            npx expo export --platform android

  # ---- Expo config + web export --------------------------------------------
  # Non-blocking web export as a shared-code smoke test. Web export is NOT
  # mobile validation — see ``mobile-android-bundle`` above for the blocking
  # native check, and ``docs/stabilisation/SUPABASE_HARDENING_PACKAGES_BCD.md``
  # for the full mobile validation matrix.
  expo-export:
    name: Expo web export (shared-code smoke test)
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Expo config sanity
        working-directory: frontend
        run: npx expo config --type public > /dev/null
      - name: Export web build
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
        run: npx expo export --platform web

  # ---- Secret scan ---------------------------------------------------------
  secret-scan:
    name: Secret scan
    needs: scope
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Python dependency vulnerability scan --------------------------------
  # Blocks merge on HIGH or CRITICAL vulnerabilities. Lower-severity findings
  # (LOW / MEDIUM / UNKNOWN) are recorded in the artifact for backlog triage.
  pip-audit:
    name: Python dependency audit
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.python_deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit requirements (strict — fail on any advisory)
        working-directory: backend
        # No suppression flags. Python audit exceptions are zero, and
        # backend/tests/test_no_python_audit_ignores.py fails the build if an
        # inline suppression reappears. Reintroducing one is a deliberate
        # governance change, not something to slip into an unrelated PR.
        run: |
          pip-audit -r requirements.txt \
            --vulnerability-service osv \
            --strict
      - name: Full audit report (failure diagnostics)
        if: failure()
        working-directory: backend
        run: pip-audit -r requirements.txt --vulnerability-service osv --format=json > /tmp/pip-audit.json || true
      - name: Upload full pip-audit report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-report
          path: /tmp/pip-audit.json
          retention-days: 7

  # ---- Node dependency vulnerability scan ----------------------------------
  npm-audit:
    name: Node dependency audit
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.node_deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Node audit validator tests
        run: node --test security/validate-node-audit.test.js security/run-node-audit.test.js
      - name: yarn audit and strict exception validation
        working-directory: frontend
        run: |
          # run-node-audit.js retries an audit that did not run to completion and
          # never decides pass or fail. Completion means a valid auditSummary;
          # advisory records alone do not prove the scan finished. Advisories
          # observed on incomplete attempts are carried forward, so retries
          # recover completeness without erasing evidence. The validator below,
          # rather than Yarn's exit bitmask, remains the gate: if no attempt
          # completed, the output has no summary and it fails closed.
          node ../security/run-node-audit.js /tmp/yarn-audit.json
          node ../security/validate-node-audit.js /tmp/yarn-audit.json ../security/node-audit-exceptions.json ../security/node-audit-false-positives.json
      - name: Upload yarn-audit report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yarn-audit-report
          path: /tmp/yarn-audit.json
          retention-days: 7

  # ---- Production Docker build -----------------------------------------------
  docker-build:
    name: Production Docker build
    needs: scope
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build production image
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t glamgenius-backend:ci \
            backend/
      - name: Verify non-root user
        run: |
          USER_ID=$(docker run --rm glamgenius-backend:ci id -u)
          echo "Container runs as UID=$USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "FAIL: container runs as root"
            exit 1
          fi
      - name: Verify no compiler in runtime image
        run: |
          if docker run --rm glamgenius-backend:ci which gcc 2>/dev/null; then
            echo "FAIL: gcc found in runtime image"
            exit 1
          fi
          echo "PASS: no compiler in runtime image"
      - name: Verify COMMIT_SHA label
        run: |
          SHA=$(docker run --rm glamgenius-backend:ci printenv COMMIT_SHA)
          echo "COMMIT_SHA=$SHA"
          if [ "$SHA" != "${{ github.sha }}" ]; then
            echo "FAIL: COMMIT_SHA mismatch"
            exit 1
          fi
      - name: Save image for downstream jobs
        run: docker save glamgenius-backend:ci | gzip > /tmp/glamgenius-backend-ci.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image
          path: /tmp/glamgenius-backend-ci.tar.gz
          retention-days: 1

  # ---- The exact image Render deploys ----------------------------------------
  #
  # `docker-build` above qualifies backend/Dockerfile, which is the local and
  # compose contract. It is NOT what production runs: render.yaml deploys
  # deploy/render/Dockerfile built from the repository root, because the Phase B
  # operator deliberately lives outside backend/ and a backend-context build
  # cannot reach it.
  #
  # Until this job existed, a pull request could change the production image,
  # set container scope true, watch CI go green, and never once have built the
  # thing Render would deploy. Everything below runs against the real image
  # produced by the real Dockerfile and the real .dockerignore. Nothing is
  # neutralised and no fixture stands in for the filesystem.
  render-image:
    name: Render production image
    needs: scope
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the exact Render production image
        run: |
          docker build \
            --platform linux/amd64 \
            -f deploy/render/Dockerfile \
            -t glamgenius-render:ci \
            .
      - name: Runtime identity is the non-root application user
        run: |
          UID_AT_RUNTIME=$(docker run --rm glamgenius-render:ci id -u)
          CONFIGURED_USER=$(docker inspect glamgenius-render:ci --format '{{.Config.User}}')
          echo "uid=$UID_AT_RUNTIME configured_user=$CONFIGURED_USER"
          if [ "$UID_AT_RUNTIME" != "10001" ] || [ "$CONFIGURED_USER" != "10001" ]; then
            echo "FAIL: the production image must run as uid 10001"
            exit 1
          fi
          echo "PASS: runs as non-root uid 10001"
      - name: No build chain in the runtime image
        run: |
          for tool in gcc cc g++ make ld; do
            if docker run --rm glamgenius-render:ci sh -c "command -v $tool" 2>/dev/null; then
              echo "FAIL: $tool is present in the runtime image"
              exit 1
            fi
          done
          echo "PASS: no compiler or build chain in the runtime image"
      # A Phase B boundary test forbids the controlled-activation operator's
      # filename from appearing anywhere under .github/, because an automation
      # surface that knows its name is how an automatic execution eventually
      # creeps in. That guard is right and this job respects it rather than
      # routing around it: CI asserts the *shape* of what shipped, and the
      # repository test suite -- which is allowed to name the operator --
      # asserts that the Dockerfile copies that exact file. Together the two
      # cover identity and packaging without CI ever naming it.
      - name: Working layout preserves the repository relationship
        run: |
          docker run --rm glamgenius-render:ci test -d /workspace/backend
          WORKDIR=$(docker inspect glamgenius-render:ci --format '{{.Config.WorkingDir}}')
          if [ "$WORKDIR" != "/workspace/backend" ]; then
            echo "FAIL: WorkingDir is $WORKDIR, expected /workspace/backend"
            exit 1
          fi
          SCRIPT_COUNT=$(docker run --rm glamgenius-render:ci sh -c 'ls -A /workspace/scripts | wc -l')
          if [ "$SCRIPT_COUNT" != "1" ]; then
            echo "FAIL: /workspace/scripts must hold exactly one shipped script, found $SCRIPT_COUNT:"
            docker run --rm glamgenius-render:ci sh -c 'ls -A /workspace/scripts'
            exit 1
          fi
          echo "PASS: layout is /workspace/backend plus exactly one shipped script"
      - name: Excluded repository material is absent from the image
        run: |
          docker run --rm glamgenius-render:ci sh -c '
            fail=0
            for path in /workspace/frontend /workspace/.git /workspace/backend/tests \
                        /workspace/docs /workspace/.env /workspace/tests \
                        /workspace/security /workspace/memory /workspace/node_modules; do
              if [ -e "$path" ]; then echo "FAIL: $path is in the image"; fail=1; fi
            done
            if find /workspace -name ".env*" -print -quit | grep -q .; then
              echo "FAIL: an environment file reached the image"; fail=1
            fi
            exit $fail
          '
          echo "PASS: no excluded repository material in the image"
      - name: Entrypoint is executable and PID 1 is tini
        run: |
          docker run --rm glamgenius-render:ci test -x /usr/local/bin/glamgenius-entrypoint
          ENTRYPOINT=$(docker inspect glamgenius-render:ci --format '{{json .Config.Entrypoint}}')
          echo "entrypoint=$ENTRYPOINT"
          case "$ENTRYPOINT" in
            *"/usr/bin/tini"*"glamgenius-entrypoint"*) ;;
            *) echo "FAIL: PID 1 must be tini, followed by the entrypoint"; exit 1 ;;
          esac
          echo "PASS: tini is PID 1 and the entrypoint is executable"
      - name: Docker healthcheck is liveness, on a route that exists
        run: |
          HEALTHCHECK=$(docker inspect glamgenius-render:ci --format '{{json .Config.Healthcheck.Test}}')
          echo "healthcheck=$HEALTHCHECK"
          case "$HEALTHCHECK" in
            *"/api/v2/health"*) ;;
            *) echo "FAIL: the healthcheck must target /api/v2/health"; exit 1 ;;
          esac
          # /api/v2/health contains /health as a substring, so the wrong forms
          # are matched precisely rather than by a naive negative search.
          case "$HEALTHCHECK" in
            *"8000/health"*) echo "FAIL: healthcheck targets /health, which no router serves"; exit 1 ;;
          esac
          case "$HEALTHCHECK" in
            *"/api/v2/ready"*) echo "FAIL: liveness must not depend on PostgreSQL"; exit 1 ;;
          esac
          echo "PASS: liveness targets /api/v2/health"
      - name: The shipped operator imports and its parser works, unexecuted
        run: |
          # Discovered, never named -- see the note above. This imports the
          # module, which proves every dependency it needs resolves inside the
          # image, then builds its parser and reads its help. Nothing is
          # dispatched: main() is never called, so no operation runs and no
          # database is touched.
          docker run --rm glamgenius-render:ci python -c "
          import importlib.util, pathlib
          scripts = sorted(pathlib.Path('/workspace/scripts').glob('*.py'))
          assert len(scripts) == 1, scripts
          spec = importlib.util.spec_from_file_location('shipped_operator', scripts[0])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          parser = module.build_parser()
          help_text = parser.format_help()
          for operation in ('status', 'prepare', 'compile', 'activate', 'deactivate'):
              assert operation in help_text, operation
          assert parser.parse_args(['status']).operation == 'status'
          print('PASS: shipped operator imports and parses; nothing dispatched')
          "
      - name: Application modules import inside the image
        run: |
          docker run --rm glamgenius-render:ci python -c "
          import importlib
          for module in ('server', 'app.release', 'app.workers.account_deletion', 'app.workers.notifications'):
              importlib.import_module(module)
          print('PASS: all production modules import')
          "
      - name: Render supplies the deployed commit at runtime
        run: |
          SENTINEL=0123456789abcdef0123456789abcdef01234567
          # Through the real entrypoint: Render sets RENDER_GIT_COMMIT, and the
          # image turns it into COMMIT_SHA, which both workers record on their
          # heartbeat. Nothing is baked in at build time.
          docker run --rm -e RENDER_GIT_COMMIT=$SENTINEL glamgenius-render:ci \
            python -c "import os,sys; sys.exit(0 if os.environ.get('COMMIT_SHA') == '$SENTINEL' else 1)"
          # An explicitly supplied value keeps precedence, as documented.
          docker run --rm -e RENDER_GIT_COMMIT=$SENTINEL -e COMMIT_SHA=explicit-build-value glamgenius-render:ci \
            python -c "import os,sys; sys.exit(0 if os.environ.get('COMMIT_SHA') == 'explicit-build-value' else 1)"
          # Neither set degrades rather than crashing.
          docker run --rm glamgenius-render:ci \
            python -c "import os,sys; sys.exit(0 if os.environ.get('COMMIT_SHA') == 'unknown' else 1)"
          echo "PASS: RENDER_GIT_COMMIT reaches the application as COMMIT_SHA"
      - name: Save the production image for scanning
        run: docker save glamgenius-render:ci | gzip > /tmp/glamgenius-render-ci.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-image
          path: /tmp/glamgenius-render-ci.tar.gz
          retention-days: 1

  # ---- Container vulnerability scan (Trivy) ----------------------------------
  # Both images, one policy. The severity threshold, the exception registry and
  # its validator are shared deliberately: a second, weaker gate for the image
  # that actually reaches production would defeat the point of having a gate.
  container-scan:
    name: Container vulnerability scan
    needs: [scope, docker-build, render-image]
    if: needs.scope.outputs.container == 'true' && needs.docker-build.result == 'success' && needs.render-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
          path: /tmp
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: render-image
          path: /tmp
      - name: Load images
        run: |
          docker load < /tmp/glamgenius-backend-ci.tar.gz
          docker load < /tmp/glamgenius-render-ci.tar.gz
      - name: Validate Trivy Exceptions
        run: python scripts/validate_trivy_exceptions.py
      - name: Run Trivy vulnerability scanner (backend image)
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.30.0
        with:
          image-ref: glamgenius-backend:ci
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
      - name: Run Trivy vulnerability scanner (Render production image)
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.30.0
        with:
          image-ref: glamgenius-render:ci
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
      - name: Generate Trivy JSON report
        if: failure()
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # v0.30.0
        with:
          image-ref: glamgenius-render:ci
          format: json
          output: /tmp/trivy-report.json
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: trivy-report
          path: /tmp/trivy-report.json
          retention-days: 7

  # ---- SBOM generation -------------------------------------------------------
  sbom:
    name: SBOM generation
    needs: [scope, docker-build, render-image]
    if: needs.scope.outputs.container == 'true' && needs.docker-build.result == 'success' && needs.render-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
          path: /tmp
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: render-image
          path: /tmp
      - name: Load images
        run: |
          docker load < /tmp/glamgenius-backend-ci.tar.gz
          docker load < /tmp/glamgenius-render-ci.tar.gz
      - name: Generate Backend Container SBOM (SPDX JSON)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.2
        with:
          image: glamgenius-backend:ci
          format: spdx-json
          output-file: /tmp/backend-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sbom
          path: /tmp/backend-sbom.spdx.json

      # The mandatory one for the production runtime: this is the image Render
      # deploys. Kept as a separate artifact so the two are never confused.
      - name: Generate Render Production Image SBOM (SPDX JSON)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.2
        with:
          image: glamgenius-render:ci
          format: spdx-json
          output-file: /tmp/render-production-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-production-sbom
          path: /tmp/render-production-sbom.spdx.json

      - name: Generate Frontend Dependency SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.2
        with:
          path: frontend
          format: cyclonedx-json
          output-file: /tmp/frontend-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-sbom
          path: /tmp/frontend-sbom.cdx.json


  # ---- Legacy and payment absence --------------------------------------------
  legacy-absence:
    name: Legacy and payment absence
    needs: scope
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No MongoDB references
        run: |
          if grep -rn "mongodb\|MongoClient\|pymongo\|motor" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: MongoDB references found in backend code"
            exit 1
          fi
          echo "PASS: no MongoDB references"
      - name: No MinIO or S3 compatibility
        run: |
          if grep -rn "minio\|MinIO\|boto3\|s3_client\|S3_BUCKET" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: MinIO/S3 references found"
            exit 1
          fi
          echo "PASS: no MinIO/S3 references"
      - name: No payment or billing code
        run: |
          if grep -rn "stripe\|Stripe\|payment_intent\|billing\|subscription" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: payment/billing references found"
            exit 1
          fi
          echo "PASS: no payment/billing references"
      - name: No legacy terminology
        run: |
          if grep -rnE "Package [A-Z]|legacy project|temporary compatibility" backend/app/ backend/server.py --include="*.py"; then
            echo "FAIL: legacy terminology found"
            exit 1
          fi
          echo "PASS: no legacy terminology"
      - name: "Workflow policy: immutable action pins"
        run: |
          if grep -RInE "uses:[[:space:]]*[^[:space:]]+@(master|main|latest)($|[[:space:]])" .github/workflows/; then
            echo "FAIL: mutable GitHub Action reference found"
            exit 1
          fi
          if grep -RInE "uses:[[:space:]]*[^[:space:]]+@[0-9A-Fa-f]{40}($|[[:space:]]+#)" .github/workflows/ | wc -l | grep -q '^0$'; then
            echo "FAIL: no immutable GitHub Action SHA pins found"
            exit 1
          fi
          echo "PASS: GitHub Actions use immutable SHA pins"

  # ---- Focused test gates (run from the full backend suite) ------------------
  # These re-run targeted subsets so failures are immediately attributable.

  auth-security:
    name: Authentication security
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-one
      SUPABASE_JWT_ISSUER: https://ci-project.supabase.co/auth/v1
      SUPABASE_JWKS_URL: https://ci-project.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_STORAGE_BUCKET: glamgenius-media
      SUPABASE_ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000001
      GEMINI_API_KEY: ""
      REQUIRE_ANALYSIS_CONSENT: "false"
      CONSENT_VERSION: "ci-test"
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_ROOT: /tmp/media-test
      INVITE_REQUIRED: "false"
      BETA_AI_REQUESTS_PER_HOUR: "60"
      BETA_SCAN_LIMIT_PER_MONTH: "60"
      BETA_STYLE_LIMIT_PER_MONTH: "60"
      BETA_SHOPPING_CHECK_LIMIT_PER_MONTH: "60"
      ALLOWED_ORIGINS: "http://localhost:8081"
      APP_ENV: "test"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: cd backend && alembic upgrade head
      - name: Auth security tests
