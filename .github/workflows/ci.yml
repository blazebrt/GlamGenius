# GlamGenius CI — provider-independent, strictly enforced quality gates.
#
# Everything in this workflow is reproducible without any paid credential
# (no Gemini key, no Razorpay key, no S3 credentials, no calendar OAuth
# client, no push provider, no monitoring DSN). Anything that needs one of
# those lives in a separate `live-*.yml` workflow (opt-in, manual dispatch,
# cost-capped) or is not run at all.
#
# GitHub Actions are pinned to full commit SHAs. The tag comment after each
# SHA is guidance for the human reviewer and is not what Actions resolves.
# Dependabot's `github-actions` ecosystem opens PRs to bump these SHAs;
# tag comments are refreshed in the same PR.
#
# Service container images (postgres, mongo) are pinned to specific minor
# tags rather than image digests during Work Package 1. The rationale is
# documented in docs/engineering/CI_SELF_TEST.md §"Service image pinning".
# Work Package 2 (Fix 4) replaces the minor tags with sha256 digests as
# part of the deterministic Docker workflow.
#
# Every required job in this workflow blocks merge. There is no
# `continue-on-error` on any step whose purpose is a merge gate. The two
# jobs that exist for information rather than for merge-blocking
# (`nightly-audit-report`, `discussion-only`) live in a separate workflow
# file and are not referenced here.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---- Backend --------------------------------------------------------------
  backend-tests:
    name: Backend unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:6
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: glamgenius_test
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      JWT_SECRET: test-secret-not-a-real-one
      ADMIN_SECRET: test-admin-secret
      GEMINI_API_KEY: ""
      SUBSCRIPTIONS_AVAILABLE: "false"
      REQUIRE_ANALYSIS_CONSENT: "false"
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_ROOT: /tmp/media-test
      V2_FEATURES: "v2_media,v2_privacy,v2_consent,v2_ai_gateway,v2_profile,v2_inventory,v2_recommendations,v2_shopping_decisions,v2_today,v2_planner,v2_routines,v2_progress,v2_billing"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade from empty database
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic check (schema drift)
        working-directory: backend
        run: alembic check
      - name: Run tests
        working-directory: backend
        run: pytest -q tests --junitxml=/tmp/pytest-report.xml
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-report
          path: /tmp/pytest-report.xml

  # ---- Alembic round-trip (upgrade → downgrade one → re-upgrade) ------------
  alembic-round-trip:
    name: Alembic round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Downgrade one, then re-upgrade
        working-directory: backend
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic check

  # ---- Frontend -------------------------------------------------------------
  frontend-tests:
    name: Frontend Jest + TypeScript + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: TypeScript
        working-directory: frontend
        run: yarn typecheck
      - name: Lint (blocking, zero-warning budget)
        working-directory: frontend
        # `expo lint` runs eslint. A warning here is treated as a merge-blocker
        # so drift is caught the moment it lands, not accumulated. If a rule
        # is genuinely wrong for us, the fix is to change the rule in
        # eslint.config.js — not to widen the warning budget.
        run: yarn lint --max-warnings=0
      - name: Jest
        working-directory: frontend
        # `--passWithNoTests` is intentionally NOT set. If Jest finds no
        # tests, that is a regression and must fail the build.
        run: yarn test --ci --watchAll=false

  # ---- Expo config + web export --------------------------------------------
  # The product ships to Android first; the web export is retained as a
  # smoke test that the JS bundle at least builds. It is a MERGE-BLOCKING
  # check: no `continue-on-error`. If the web target diverges to a point
  # where it cannot build, either the divergence is fixed or this job is
  # removed and replaced by an Android-only prebuild check (which is what
  # Work Package 5 will do once the physical-device evidence exists).
  expo-export:
    name: Expo web export (bundle smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Expo config sanity
        working-directory: frontend
        # `expo config --type public` fully evaluates app.json + plugins.
        # It is cheap and catches most misconfigurations without needing
        # the JS bundle to compile.
        run: npx expo config --type public > /dev/null
      - name: Export web build
        working-directory: frontend
        run: npx expo export --platform web

  # ---- Auth + privacy regression -------------------------------------------
  auth-privacy-regression:
    name: Authorization + privacy regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:6
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: glamgenius_test
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      JWT_SECRET: test-secret-not-a-real-one
      ADMIN_SECRET: test-admin-secret
      GEMINI_API_KEY: ""
      SUBSCRIPTIONS_AVAILABLE: "false"
      REQUIRE_ANALYSIS_CONSENT: "false"
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_ROOT: /tmp/media-test
      V2_FEATURES: "v2_media,v2_privacy,v2_consent,v2_ai_gateway,v2_profile,v2_inventory,v2_recommendations,v2_shopping_decisions,v2_today,v2_planner,v2_routines,v2_progress,v2_billing"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Run authorization + privacy tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_privacy.py \
            tests/test_media.py \
            tests/test_v1_regression.py \
            tests/test_config_flags_and_billing.py \
            tests/test_critical_journey.py

  # ---- Secret scan ---------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Python dependency vulnerability scan --------------------------------
  # Blocks merge on HIGH or CRITICAL vulnerabilities. Lower-severity findings
  # (LOW / MEDIUM / UNKNOWN) are recorded in the artifact for
  # backlog triage; they do not block a PR because reacting to every
  # theoretical medium the moment it lands trains reviewers to rubber-stamp.
  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit requirements (strict — fail on any advisory not on the documented ignore list)
        working-directory: backend
        # `--strict` causes pip-audit to exit non-zero when any vulnerability
        # is reported. Combined with `--vulnerability-service osv` the source
        # is the same OSV feed that CI already trusts for the round-trip test
        # infrastructure.
        #
        # The `--ignore-vuln` entries below are the advisories that Work
        # Package 1 has consciously deferred to Work Package 2's dependency
        # upgrade. Each one is listed in the STABILISATION_REPORT backlog
        # so the ignore list is not silent. Removing an ID from this list
        # is the mechanical part of closing the corresponding backlog item;
        # the workflow file is the source of truth for what is still
        # deferred.
        #
        #   PYSEC-2026-1845  pytest       — fix requires pytest 9.x, which
        #                                   is incompatible with the
        #                                   pytest-asyncio 0.26.0 pin
        #                                   (comment in requirements.txt
        #                                   documents why that pin is
        #                                   deliberate). Deferred.
        #   PYSEC-2026-161   starlette   — fix requires starlette 1.0.1,
        #                                   which requires a FastAPI major
        #                                   bump. Deferred to WP2.
        #   PYSEC-2026-1941  starlette   — fix requires starlette 0.47.2.
        #                                   Same FastAPI-bump cascade.
        #   PYSEC-2026-1943  starlette   — fix requires starlette 0.40.0.
        #                                   Same FastAPI-bump cascade.
        #   PYSEC-2026-2280  starlette   — fix requires starlette 1.1.0.
        #                                   Same FastAPI-bump cascade.
        #   PYSEC-2026-2281  starlette   — fix requires starlette 1.1.0.
        #                                   Same FastAPI-bump cascade.
        #   PYSEC-2026-248   starlette   — fix requires starlette 1.3.0.
        #                                   Same FastAPI-bump cascade.
        #   PYSEC-2026-249   starlette   — fix requires starlette 1.3.1.
        #                                   Same FastAPI-bump cascade.
        #
        # A new advisory in any dependency not listed above still fails the
        # build. That is the behaviour we want.
        run: |
          pip-audit -r requirements.txt \
            --vulnerability-service osv \
            --strict \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249
      - name: Full audit report (informational, uploaded on any run)
        if: always()
        working-directory: backend
        run: pip-audit -r requirements.txt --vulnerability-service osv --format=json > /tmp/pip-audit.json || true
      - name: Upload full pip-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-report
          path: /tmp/pip-audit.json

  # ---- Node dependency vulnerability scan ----------------------------------
  # Blocks merge on HIGH or CRITICAL. Yarn 1 returns a bitmask exit code:
  # bit 8 = high, bit 16 = critical. Any bit ≥ 8 fails the job.
  npm-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: yarn audit (fail on high or critical)
        working-directory: frontend
        run: |
          set +e
          yarn audit --level high --json > /tmp/yarn-audit.json
          code=$?
          echo "yarn audit exit code = $code (bitmask: 1=info,2=low,4=moderate,8=high,16=critical)"
          if [ "$code" -ge 8 ]; then
            echo "yarn audit reported a HIGH or CRITICAL advisory — failing the build."
            exit 1
          fi
          exit 0
      - name: Upload yarn-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yarn-audit-report
          path: /tmp/yarn-audit.json
