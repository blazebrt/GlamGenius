# GlamGenius CI — Supabase V2 architecture.
#
# Everything in this workflow is reproducible without any paid credential
# (no Gemini key, no S3 credentials, no calendar OAuth client, no push
# provider, no monitoring DSN, no real Supabase project). Supabase Auth is
# stubbed in tests by signing JWTs with a test HS256 secret; the backend
# accepts them because `SUPABASE_JWT_SECRET` in the CI env is that same
# test secret and no JWKS URL is reachable in CI.
#
# GitHub Actions are pinned to full commit SHAs. The tag comment after each
# SHA is guidance for the human reviewer.
#
# Service container images (postgres) are pinned to specific minor tags.
#
# Every required job in this workflow blocks merge. There is no
# `continue-on-error` on any merge-gate step.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---- Backend --------------------------------------------------------------
  backend-tests:
    name: Backend unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-one
      SUPABASE_JWT_ISSUER: https://ci-project.supabase.co/auth/v1
      SUPABASE_JWKS_URL: https://ci-project.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_JWT_SECRET: ci-hs256-jwt-secret-not-a-real-one
      SUPABASE_STORAGE_BUCKET: glamgenius-media
      SUPABASE_ADMIN_USER_IDS: 00000000-0000-0000-0000-000000000001
      GEMINI_API_KEY: ""
      REQUIRE_ANALYSIS_CONSENT: "false"
      CONSENT_VERSION: "ci-test"
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_ROOT: /tmp/media-test
      INVITE_REQUIRED: "false"
      BETA_AI_REQUESTS_PER_HOUR: "60"
      BETA_SCAN_LIMIT_PER_MONTH: "60"
      BETA_STYLE_LIMIT_PER_MONTH: "60"
      BETA_SHOPPING_CHECK_LIMIT_PER_MONTH: "60"
      ALLOWED_ORIGINS: "http://localhost:8081"
      APP_ENV: "test"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade from empty database
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic check (schema drift)
        working-directory: backend
        run: alembic check
      - name: Reference-data seed (idempotent)
        working-directory: backend
        run: |
          python -m app.bootstrap.reference_data
          python -m app.bootstrap.reference_data
      - name: Run tests
        working-directory: backend
        run: pytest -q tests --junitxml=/tmp/pytest-report.xml
      - name: Run invite-reservation tests with INVITE_REQUIRED=true
        working-directory: backend
        env:
          INVITE_REQUIRED: "true"
        run: pytest -q tests/test_invite_reservation.py tests/test_invite_bypass_regression.py
      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-report
          path: /tmp/pytest-report.xml

  # ---- Alembic round-trip (upgrade → downgrade one → re-upgrade) ------------
  alembic-round-trip:
    name: Alembic round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glamgenius
          POSTGRES_PASSWORD: glamgenius
          POSTGRES_DB: glamgenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glamgenius -d glamgenius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: postgresql+asyncpg://glamgenius:glamgenius@localhost:5432/glamgenius_test
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Downgrade to base, then re-upgrade
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  # ---- Frontend -------------------------------------------------------------
  frontend-tests:
    name: Frontend Jest + TypeScript + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: TypeScript
        working-directory: frontend
        run: yarn typecheck
      - name: Lint (blocking, zero-warning budget)
        working-directory: frontend
        # `expo lint` runs eslint. A warning here is a merge-blocker.
        run: yarn lint --max-warnings=0
      - name: Jest
        working-directory: frontend
        # `--passWithNoTests` is intentionally NOT set.
        run: yarn test --ci --watchAll=false

  # ---- Mobile: Android bundle validation (blocking) ------------------------
  # Verifies the Expo project compiles for Android as a Metro bundle. This is
  # the smallest blocking check that proves the mobile shell still builds. A
  # full APK/AAB build via EAS runs on release cuts, not on every PR.
  mobile-android-bundle:
    name: Mobile Android Metro bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Metro Android bundle (verifies native shell compiles)
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
        run: |
          npx expo export --platform android --output-dir /tmp/expo-android || \
            npx expo export --platform android

  # ---- Expo config + web export --------------------------------------------
  # Non-blocking web export as a shared-code smoke test. Web export is NOT
  # mobile validation — see ``mobile-android-bundle`` above for the blocking
  # native check, and ``docs/stabilisation/SUPABASE_HARDENING_PACKAGES_BCD.md``
  # for the full mobile validation matrix.
  expo-export:
    name: Expo web export (shared-code smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Expo config sanity
        working-directory: frontend
        run: npx expo config --type public > /dev/null
      - name: Export web build
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-one
        run: npx expo export --platform web

  # ---- Secret scan ---------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Python dependency vulnerability scan --------------------------------
  # Blocks merge on HIGH or CRITICAL vulnerabilities. Lower-severity findings
  # (LOW / MEDIUM / UNKNOWN) are recorded in the artifact for backlog triage.
  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit requirements (strict — fail on any advisory not on the documented ignore list)
        working-directory: backend
        # See the Stabilisation Report backlog for the rationale on each ignored ID.
        run: |
          pip-audit -r requirements.txt \
            --vulnerability-service osv \
            --strict \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249
      - name: Full audit report (informational, uploaded on any run)
        if: always()
        working-directory: backend
        run: pip-audit -r requirements.txt --vulnerability-service osv --format=json > /tmp/pip-audit.json || true
      - name: Upload full pip-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-report
          path: /tmp/pip-audit.json

  # ---- Node dependency vulnerability scan ----------------------------------
  npm-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: yarn audit (fail on high or critical)
        working-directory: frontend
        run: |
          set +e
          yarn audit --level high --json > /tmp/yarn-audit.json
          code=$?
          echo "yarn audit exit code = $code (bitmask: 1=info,2=low,4=moderate,8=high,16=critical)"
          if [ "$code" -ge 8 ]; then
            echo "yarn audit reported a HIGH or CRITICAL advisory — failing the build."
            exit 1
          fi
          exit 0
      - name: Upload yarn-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yarn-audit-report
          path: /tmp/yarn-audit.json
