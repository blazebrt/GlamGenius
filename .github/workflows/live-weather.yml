# Live weather integration proof (Fix 6, WP5).
#
# Manually-dispatched proof that the Open-Meteo weather adapter works
# end-to-end. No credential required (Open-Meteo is keyless), so this
# workflow can be dispatched by anyone with write access.
#
# The workflow hits three real coordinates and reports the returned
# condition bucket. It does not test paid-provider adapters — those,
# when added, use their own live-* workflow.

name: Live weather probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: Open-Meteo round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEATHER_PROVIDER: open_meteo
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          from app.domains.planning.weather import get_weather

          async def main():
              # Three representative Indian coordinates: Bengaluru, Mumbai, Delhi.
              locations = [
                  ("Bengaluru", 12.97, 77.59),
                  ("Mumbai",    19.07, 72.87),
                  ("Delhi",     28.61, 77.20),
              ]
              failed = 0
              for name, lat, lon in locations:
                  w = await get_weather(lat, lon)
                  if w.condition == "unknown":
                      print(f"FAIL {name} ({lat},{lon}): returned unknown")
                      failed += 1
                  else:
                      print(f"OK   {name} ({lat},{lon}): {w.condition} "
                            f"temp={w.temperature_c}C humidity={w.humidity_percent}%")
              raise SystemExit(1 if failed else 0)

          asyncio.run(main())
          PY
