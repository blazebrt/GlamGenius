# Live Gemini validation workflow (Fix 5, WP3).
#
# Manually dispatched, opt-in. Never triggered by push, PR, or schedule.
# Runs the project-owned live probe against the real Gemini API using the
# repository's own GEMINI_API_KEY secret. The workflow uploads the JSON
# report as an artefact so the reviewer can attach it to the PR that
# claimed a successful validation run.
#
# Cost cap:
#   * The probe honours GLAMGENIUS_LIVE_PROBE_MAX_CALLS (default 10). This
#     workflow does not override it, so a single dispatch spends at most
#     10 Gemini calls.
#   * No retry loop; every attempted call is one attempted call.
#
# Never uses customer images:
#   * The probe ships an inlined 3x3 solid PNG. There is no code path in
#     this workflow that reads a customer photo, a media asset, or an
#     account-associated file.
#
# Never runs on an untrusted PR:
#   * `on: workflow_dispatch` only. `on: pull_request` deliberately absent.
#   * `permissions:` restricts the token to `contents: read` — the workflow
#     cannot approve itself, comment on PRs, or write to the repo.
#
# Never consumes a user allowance:
#   * The probe writes to /tmp only. No app database is touched. See
#     scripts/live_gemini_probe.py for the guarantee.

name: Live Gemini validation

on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Cost cap on total Gemini calls (default 10)."
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: live-gemini
  cancel-in-progress: false

jobs:
  probe:
    name: Live Gemini probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GLAMGENIUS_LIVE_PROBE_ENABLED: "true"
      GLAMGENIUS_LIVE_PROBE_MAX_CALLS: ${{ github.event.inputs.max_calls }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify key is present (redacted echo)
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY secret is not configured on the repo." >&2
            exit 1
          fi
          echo "GEMINI_API_KEY is present (length=${#GEMINI_API_KEY})"

      - name: Run live probe
        run: python scripts/live_gemini_probe.py --report /tmp/live_gemini_report.json

      - name: Attach machine-readable report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-gemini-report
          path: /tmp/live_gemini_report.json
